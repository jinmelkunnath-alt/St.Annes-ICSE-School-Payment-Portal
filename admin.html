<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>St. Anne's ICSE School | Admin Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
        }

        body {
            background: #f5f9ff;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* ---------- BACKGROUND MESH + PARTICLES (subtle) ---------- */
        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 20% 30%, rgba(30, 60, 114, 0.03) 0%, rgba(42, 82, 152, 0.02) 100%);
        }
        .bg-mesh::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle, rgba(42, 82, 152, 0.04) 0%, transparent 70%);
            animation: meshMove 20s infinite alternate;
        }
        @keyframes meshMove {
            0% { transform: translate(0%, 0%) rotate(0deg); }
            100% { transform: translate(5%, 5%) rotate(2deg); }
        }
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            background: rgba(42, 82, 152, 0.08);
            border-radius: 50%;
            animation: float 12s infinite ease-in-out;
        }
        @keyframes float {
            0% { transform: translateY(0px) translateX(0px); opacity: 0; }
            20% { opacity: 0.5; }
            80% { opacity: 0.5; }
            100% { transform: translateY(-100px) translateX(30px); opacity: 0; }
        }

        /* Sticky Header (glass effect) */
        .admin-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02), 0 1px 0 rgba(0, 0, 0, 0.02);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 1px solid rgba(42, 82, 152, 0.15);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-placeholder {
            width: 52px;
            height: 52px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.05);
            background: #fff;
        }

        .logo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .title-group h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(120deg, #1E3C72, #2A5298);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            cursor: default;
        }

        .title-group p {
            font-size: 0.75rem;
            color: #5b6e8c;
            font-weight: 500;
        }

        /* Header actions (buttons) */
        .header-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .verify-receipt-btn {
            background: rgba(238, 242, 255, 0.9);
            border: 1px solid rgba(42, 82, 152, 0.3);
            color: #1e3c72;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
        }
        .verify-receipt-btn:hover {
            background: rgba(42, 82, 152, 0.15);
            transform: translateY(-1px);
        }

        /* Main container */
        .app-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            position: relative;
            z-index: 1;
        }

        /* Class Grid */
        .classes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 170px));
            gap: 1.8rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .class-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            aspect-ratio: 1 / 1;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0,0,0,0.02);
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            cursor: pointer;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
            opacity: 0;
            animation: cardAppear 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .class-card svg {
            width: 42px;
            height: 42px;
            stroke: #2a5298;
            stroke-width: 1.5;
            fill: none;
            margin-bottom: 0.7rem;
        }

        .class-card span {
            font-weight: 700;
            font-size: 1.3rem;
            background: linear-gradient(135deg, #1E3C72, #2A5298);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .class-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 30px 40px -12px rgba(0, 0, 0, 0.2);
            border-color: rgba(42, 82, 152, 0.3);
            background: rgba(255, 255, 255, 0.95);
        }

        .class-card:active {
            transform: scale(0.98);
        }

        /* Fullscreen Loading Overlay (only used for class click) */
        .fullscreen-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s ease;
        }
        .fullscreen-loader.active {
            visibility: visible;
            opacity: 1;
        }
        .loader-content {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            padding: 2rem 2.5rem;
            border-radius: 2rem;
            box-shadow: 0 30px 40px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
        }
        .loader-message {
            font-size: 1.3rem;
            font-weight: 500;
            color: #1e3c72;
            margin-bottom: 1rem;
        }
        .skeleton-list {
            margin-top: 1.5rem;
        }
        .skeleton-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 1.2rem;
            padding: 0.8rem 1rem;
            margin-bottom: 0.8rem;
        }
        .skeleton-name {
            width: 60%;
            height: 20px;
            background: linear-gradient(90deg, #e2e8f0 25%, #f0f4fa 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 1rem;
        }
        .skeleton-icon {
            width: 24px;
            height: 24px;
            background: #e2e8f0;
            border-radius: 50%;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .dot-floating {
            font-size: 1.3rem;
            letter-spacing: 4px;
        }

        /* Fullscreen Student View */
        .fullscreen-student-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(245, 249, 255, 0.95);
            backdrop-filter: blur(4px);
            z-index: 200;
            overflow-y: auto;
            padding-top: 90px;
            padding-bottom: 2rem;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s ease;
        }
        .fullscreen-student-view.active {
            visibility: visible;
            opacity: 1;
        }
        .student-view-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }
        .student-view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            gap: 1rem;
        }
        .class-badge {
            background: rgba(238, 242, 255, 0.8);
            backdrop-filter: blur(4px);
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 700;
            color: #1e3c72;
            font-size: 1.1rem;
            border: 1px solid rgba(42, 82, 152, 0.2);
        }
        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 60px;
            padding: 0.4rem 1rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            border: 1px solid rgba(203, 221, 233, 0.6);
            transition: all 0.2s;
        }
        .search-box:focus-within {
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1);
            background: white;
        }
        .search-box svg {
            width: 18px;
            height: 18px;
            stroke: #8ba0bc;
            stroke-width: 1.8;
            fill: none;
            margin-right: 0.5rem;
        }
        .search-box input {
            border: none;
            padding: 0.6rem 0.5rem;
            font-size: 0.9rem;
            width: 200px;
            outline: none;
            background: transparent;
        }
        .students-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .student-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(6px);
            border-radius: 24px;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.02), 0 1px 2px rgba(0,0,0,0.03);
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .student-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px -12px rgba(0, 0, 0, 0.15);
            border-color: rgba(42, 82, 152, 0.3);
            background: rgba(255, 255, 255, 0.95);
        }
        .student-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #0f2b3d;
        }
        .eye-icon {
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 30px;
            transition: all 0.2s;
        }
        .eye-icon svg {
            width: 22px;
            height: 22px;
            stroke: #2a5298;
            stroke-width: 1.8;
            fill: none;
        }
        .eye-icon:hover {
            background: rgba(42, 82, 152, 0.1);
            transform: scale(1.05);
        }
        .no-students {
            text-align: center;
            padding: 2.5rem;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            color: #6c86a3;
        }

        /* Modals (Add Student & Verify Receipt) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s;
        }
        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 36px;
            width: 90%;
            max-width: 520px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 1.6rem;
            box-shadow: 0 30px 40px -12px rgba(0, 0, 0, 0.2);
            border: 0.5px solid rgba(255,255,255,0.6);
            transform: scale(0.96);
            transition: transform 0.2s ease;
        }
        .modal-overlay.active .modal-card {
            transform: scale(1);
        }
        .modal-card h3 {
            font-size: 1.5rem;
            margin-bottom: 1.2rem;
            color: #1e3c72;
            border-left: 4px solid #2a5298;
            padding-left: 1rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #2c4c6e;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1px solid #cbdde9;
            border-radius: 1.5rem;
            font-size: 0.9rem;
            background: white;
            transition: all 0.2s;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }
        .modal-btn {
            border: none;
            background: #eef2f8;
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal-btn.primary {
            background: #1e4a76;
            color: white;
        }
        .modal-btn.primary:disabled {
            background: #8aaec9;
            cursor: not-allowed;
        }
        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            font-size: 1.5rem;
            cursor: pointer;
            color: #6c86a3;
        }
        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .success-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .success-card {
            background: white;
            border-radius: 32px;
            padding: 2rem;
            text-align: center;
            max-width: 320px;
            width: 90%;
            box-shadow: 0 30px 40px rgba(0,0,0,0.1);
        }
        .tick-svg {
            width: 70px;
            height: 70px;
            margin: 0 auto 1rem;
        }
        .tick-circle {
            stroke: #4CAF50;
            stroke-width: 3;
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            animation: circleAnim 0.6s ease-out forwards;
        }
        .tick-check {
            stroke: #4CAF50;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: checkAnim 0.4s ease-out 0.6s forwards;
        }
        @keyframes circleAnim { to { stroke-dashoffset: 0; } }
        @keyframes checkAnim { to { stroke-dashoffset: 0; } }

        /* ---------- Footer and Contact Developer ---------- */
        .footer {
            text-align: center;
            margin-top: 3rem;
            padding: 1rem;
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        .contact-dev {
            background: none;
            border: none;
            color: #2a5298;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: underline;
            transition: opacity 0.2s;
        }
        .contact-dev:hover {
            opacity: 0.7;
        }

        /* Contact Modal (mini screen) */
        .contact-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4000;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s;
        }
        .contact-modal.active {
            visibility: visible;
            opacity: 1;
        }
        .contact-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            width: 90%;
            max-width: 320px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 30px 40px -12px rgba(0,0,0,0.2);
            transform: scale(0.96);
            transition: transform 0.2s;
        }
        .contact-modal.active .contact-card {
            transform: scale(1);
        }
        .contact-card h3 {
            margin-bottom: 1rem;
            color: #1e3c72;
        }
        .contact-options {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 1.5rem 0;
        }
        .contact-option {
            background: rgba(238,242,255,0.9);
            border: none;
            padding: 0.8rem 1.2rem;
            border-radius: 2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .contact-option.call {
            background: #1e4a76;
            color: white;
        }
        .contact-option.whatsapp {
            background: #25D366;
            color: white;
        }
        .contact-option:hover {
            transform: translateY(-2px);
        }
        .close-contact {
            background: #eef2f8;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
        }

        /* Additional styles for dynamic fee sections */
        .checkbox-group {
            margin: 0.5rem 0;
        }
        .checkbox-group label {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            color: #1e3c72;
        }
        .fee-row {
            display: flex;
            gap: 0.5rem;
            align-items: flex-end;
        }
        .fee-row .form-group {
            flex: 1;
        }
        .auto-btn {
            background: #eef2f8;
            border: 1px solid #cbdde9;
            border-radius: 2rem;
            padding: 0.5rem 0.8rem;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .auto-btn:hover {
            background: #e2e9f2;
        }

        @media (max-width: 680px) {
            .admin-header { padding: 1rem; }
            .student-card { padding: 0.9rem 1.2rem; }
            .search-box input { width: 160px; }
            .student-view-header { flex-direction: column; align-items: stretch; }
            .class-badge { text-align: center; }
        }
    </style>
</head>
<body>

<div class="bg-mesh"></div>
<div class="particles" id="particles"></div>

<header class="admin-header">
    <div class="logo-area">
        <div class="logo-placeholder">
            <img src="https://i.ibb.co/zhWfTbDL/IMG-20251112-WA0215-3.jpg" alt="St. Anne's ICSE School Logo">
        </div>
        <div class="title-group">
            <h1 id="schoolName">St. Anne's ICSE School</h1>
            <p>Admin Panel · Quick Access</p>
        </div>
    </div>
    <div class="header-actions">
        <button id="verifyReceiptBtn" class="verify-receipt-btn">🔍 Verify Receipt</button>
    </div>
</header>

<div class="app-container">
    <div id="classView">
        <div class="classes-grid" id="classesGrid"></div>
    </div>
</div>

<!-- Fullscreen Loader (only used for class click) -->
<div id="fullscreenLoader" class="fullscreen-loader">
    <div class="loader-content">
        <div class="loader-message" id="loaderMessage">Loading<span class="dot-floating">...</span></div>
        <div class="skeleton-list">
            <div class="skeleton-item"><div class="skeleton-name"></div><div class="skeleton-icon"></div></div>
            <div class="skeleton-item"><div class="skeleton-name"></div><div class="skeleton-icon"></div></div>
            <div class="skeleton-item"><div class="skeleton-name"></div><div class="skeleton-icon"></div></div>
        </div>
    </div>
</div>

<!-- Fullscreen Student View -->
<div id="fullscreenStudentView" class="fullscreen-student-view">
    <div class="student-view-container">
        <div class="student-view-header">
            <div class="class-badge" id="currentClassBadge"></div>
            <div class="search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="studentSearchInput" placeholder="Search by name..." autocomplete="off">
            </div>
        </div>
        <div id="studentsListContainer" class="students-list"></div>
    </div>
</div>

<!-- Add Student Form Modal (Enhanced) -->
<div id="addStudentModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-close" id="closeAddModal">✕</div>
        <h3>Add New Student</h3>
        <form id="addStudentForm">
            <div class="form-group">
                <label>Student ID *</label>
                <input type="text" id="studentId" placeholder=" " required>
            </div>
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="studentName" placeholder=" " required>
            </div>
            <div class="form-group">
                <label>Class *</label>
                <select id="studentClass" required>
                    <option value="">Select Class</option>
                    <option>Playschool</option>
                    <option>LKG</option><option>UKG</option>
                    <option>STD 1</option><option>STD 2</option><option>STD 3</option><option>STD 4</option><option>STD 5</option>
                    <option>STD 6</option><option>STD 7</option><option>STD 8</option><option>STD 9</option><option>STD 10</option>
                </select>
            </div>
            <div class="form-group">
                <label>Phone Number *</label>
                <input type="tel" id="studentPhone" placeholder="e.g., 91XXXXXXXXXX" required>
            </div>
            <div class="form-group">
                <label>Term 1 Fee (₹) *</label>
                <input type="number" id="term1Fee" placeholder=" " required>
            </div>
            <div class="form-group">
                <label>Term 2 Fee (₹) *</label>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyArC1RsGTkS0cr5glTfgUdTktjcfj_Ad88",
        authDomain: "fee-payment-portal.firebaseapp.com",
        projectId: "fee-payment-portal",
        storageBucket: "fee-payment-portal.firebasestorage.app",
        messagingSenderId: "1036013822615",
        appId: "1:1036013822615:web:6c4159f84bae9882963fd2"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ADD_STUDENT_PASSWORD = "ADD123";
    const EDIT_PASSWORD = "USEREDIT123";
    const UNIVERSAL_PASSWORD = "UNIVERSAL123";
    const BASE_URL = "https://jinmelkunnath-alt.github.io/St.Annes-ICSE-School-Payment-Portal/students/student.html?id=";

    let studentData = {};
    let allStudents = [];
    let currentClass = null;
    let currentStudents = [];

    // DOM elements
    const classesGrid = document.getElementById('classesGrid');
    const classViewDiv = document.getElementById('classView');
    const fullscreenLoader = document.getElementById('fullscreenLoader');
    const fullscreenStudentView = document.getElementById('fullscreenStudentView');
    const loaderMessageEl = document.getElementById('loaderMessage');
    const currentClassBadge = document.getElementById('currentClassBadge');
    const studentSearchInput = document.getElementById('studentSearchInput');
    const studentsListContainer = document.getElementById('studentsListContainer');

    // Helper functions
    function showModal(modal) { modal.classList.add('active'); }
    function hideModal(modal) { modal.classList.remove('active'); }
    function toast(msg, isError = false) {
        const t = document.createElement('div');
        t.className = 'toast-message';
        t.style.position = 'fixed';
        t.style.bottom = '20px';
        t.style.left = '50%';
        t.style.transform = 'translateX(-50%)';
        t.style.background = isError ? '#b33b2c' : '#1e4a76';
        t.style.color = 'white';
        t.style.padding = '0.6rem 1.4rem';
        t.style.borderRadius = '3rem';
        t.style.fontSize = '0.85rem';
        t.style.zIndex = '1100';
        t.style.boxShadow = '0 4px 12px rgba(0,0,0,0.1)';
        t.innerText = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2500);
    }

    // ----- FIX: map database class values to frontend class names -----
    function mapClassToStdFormat(className) {
        if (className === "I") return "STD 1";
        if (className === "II") return "STD 2";
        if (className === "III") return "STD 3";
        if (className === "IV") return "STD 4";
        if (className === "V") return "STD 5";
        if (className === "VI") return "STD 6";
        if (className === "VII") return "STD 7";
        if (className === "VIII") return "STD 8";
        if (className === "IX") return "STD 9";
        if (className === "X") return "STD 10";
        return className; // keep as is (e.g., "LKG", "UKG", "Playschool")
    }

    async function fetchAllStudents() {
        try {
            const querySnapshot = await getDocs(collection(db, "students"));
            studentData = {};
            querySnapshot.forEach(docSnap => {
                const data = docSnap.data();
                let className = data.class;
                // Convert Roman numerals to STD format
                className = mapClassToStdFormat(className);
                if (!studentData[className]) studentData[className] = [];
                studentData[className].push({ name: data.name, id: docSnap.id });
            });
            allStudents = [];
            for (const [className, students] of Object.entries(studentData)) {
                for (const student of students) {
                    allStudents.push({
                        id: student.id,
                        name: student.name,
                        class: className,
                        phone: "",
                        terms: []
                    });
                }
            }
        } catch (err) {
            console.error(err);
            studentData = {};
        }
    }

    function renderClassGrid() {
        const classList = ["Playschool", "LKG","UKG","STD 1","STD 2","STD 3","STD 4","STD 5","STD 6","STD 7","STD 8","STD 9","STD 10"];
        classesGrid.innerHTML = '';
        classList.forEach((className, index) => {
            const card = document.createElement('div');
            card.className = 'class-card';
            card.style.animationDelay = `${index * 0.05}s`;
            card.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 3L3 9L12 15L21 9L12 3Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M5 12L3 13L12 19L21 13L19 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M5 16L3 17L12 23L21 17L19 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>${className}</span>
            `;
            card.addEventListener('click', () => onClassClick(className));
            classesGrid.appendChild(card);
        });
    }

    function onClassClick(className) {
        console.log("Class clicked:", className);
        console.log("Students in class:", studentData[className]);
        currentClass = className;
        currentStudents = studentData[className] || [];
        classViewDiv.style.display = 'none';
        fullscreenStudentView.classList.remove('active');
        fullscreenLoader.classList.add('active');
        loaderMessageEl.innerHTML = "Loading<span class='dot-floating'>...</span>";
        setTimeout(() => {
            fullscreenLoader.classList.remove('active');
            renderStudentList(currentStudents, className);
            fullscreenStudentView.classList.add('active');
            history.pushState({ page: "students", class: className }, "", `?class=${encodeURIComponent(className)}`);
        }, 800);
    }

    function renderStudentList(students, className) {
        currentClassBadge.innerHTML = `${className} · ${students.length} Students`;
        const filterRender = () => {
            const term = studentSearchInput.value.toLowerCase();
            const filtered = students.filter(s => s.name.toLowerCase().includes(term));
            studentsListContainer.innerHTML = '';
            if (filtered.length === 0) {
                studentsListContainer.innerHTML = '<div class="no-students">✨ No students found</div>';
                return;
            }
            filtered.forEach(student => {
                const card = document.createElement('div');
                card.className = 'student-card';
                card.innerHTML = `
                    <div class="student-name">${escapeHtml(student.name)}</div>
                    <div class="eye-icon" data-id="${student.id}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </div>
                `;
                const eye = card.querySelector('.eye-icon');
                eye.addEventListener('click', (e) => {
                    e.stopPropagation();
                    window.location.href = BASE_URL + encodeURIComponent(student.id);
                });
                studentsListContainer.appendChild(card);
            });
        };
        filterRender();
        studentSearchInput.oninput = filterRender;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    }

    window.addEventListener('popstate', () => {
        if (fullscreenStudentView.classList.contains('active')) {
            fullscreenStudentView.classList.remove('active');
            classViewDiv.style.display = 'block';
            studentSearchInput.value = '';
            if (window.location.search) history.pushState(null, "", window.location.pathname);
        } else {
            classViewDiv.style.display = 'block';
            fullscreenStudentView.classList.remove('active');
        }
    });

    // ---------- ADD STUDENT (Enhanced) ----------
    const addStudentModal = document.getElementById('addStudentModal');
    const closeAddModal = document.getElementById('closeAddModal');
    const cancelAddBtn = document.getElementById('cancelAddBtn');
    const addStudentForm = document.getElementById('addStudentForm');
    const enableBusFeeCheck = document.getElementById('enableBusFee');
    const busFeeFields = document.getElementById('busFeeFields');
    const autoFillBusBtn = document.getElementById('autoFillBusBtn');
    const autoFillEcaBtn = document.getElementById('autoFillEcaBtn');
    const autoFillAnnualBtn = document.getElementById('autoFillAnnualBtn');

    enableBusFeeCheck.addEventListener('change', () => {
        busFeeFields.style.display = enableBusFeeCheck.checked ? 'block' : 'none';
    });
    autoFillBusBtn.addEventListener('click', () => {
        const busInput = document.getElementById('monthlyBusFee');
        if (busInput) busInput.value = '1500';
    });
    autoFillEcaBtn.addEventListener('click', () => {
        const ecaInput = document.getElementById('ecaFee');
        if (ecaInput) ecaInput.value = '1250';
    });
    autoFillAnnualBtn.addEventListener('click', () => {
        const annualInput = document.getElementById('annualDayFee');
        if (annualInput) annualInput.value = '750';
    });

    async function createStudent(studentId, name, className, phone, term1, term2, term3, busEnabled, monthlyBusFee, ecaMonthly, annualTotal) {
        const terms = [
            { name: "Term 1 (June - September)", total: term1, paid: 0 },
            { name: "Term 2 (October - December)", total: term2, paid: 0 },
            { name: "Term 3 (January - March)", total: term3, paid: 0 }
        ];
        const otherFees = {
            eca: { monthlyAmount: ecaMonthly, paidMonths: [], partialPayments: [] },
            annualDay: { total: annualTotal, paid: 0 }
        };
        const data = { name, class: className, phone, terms, otherFees };
        if (busEnabled) {
            data.busFee = { monthlyAmount: monthlyBusFee, paidMonths: [], partialPayments: [] };
        }
        await setDoc(doc(db, "students", studentId), data);
    }

    addStudentForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        let studentId = document.getElementById('studentId').value.trim().toLowerCase();
        if (!studentId) return;
        const name = document.getElementById('studentName').value.trim();
        const className = document.getElementById('studentClass').value;
        const phone = document.getElementById('studentPhone').value.trim();
        const term1 = parseFloat(document.getElementById('term1Fee').value);
        const term2 = parseFloat(document.getElementById('term2Fee').value);
        const term3 = parseFloat(document.getElementById('term3Fee').value);
        const busEnabled = enableBusFeeCheck.checked;
        const monthlyBusFee = busEnabled ? parseFloat(document.getElementById('monthlyBusFee').value) : 0;
        const ecaMonthly = parseFloat(document.getElementById('ecaFee').value);
        const annualTotal = parseFloat(document.getElementById('annualDayFee').value);
        if (!name || !className || !phone || isNaN(term1) || isNaN(term2) || isNaN(term3) || isNaN(ecaMonthly) || isNaN(annualTotal)) {
            toast("Please fill all required fields", true);
            return;
        }
        if (busEnabled && (isNaN(monthlyBusFee) || monthlyBusFee <= 0)) {
            toast("Invalid bus fee", true);
            return;
        }
        try {
            const docRef = doc(db, "students", studentId);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                toast("Student ID already exists", true);
                return;
            }
            await createStudent(studentId, name, className, phone, term1, term2, term3, busEnabled, monthlyBusFee, ecaMonthly, annualTotal);
            if (!studentData[className]) studentData[className] = [];
            studentData[className].push({ name, id: studentId });
            allStudents.push({ id: studentId, name, class: className, phone, terms: [] });
            hideModal(addStudentModal);
            toast("Student added successfully");
        } catch (err) {
            console.error(err);
            toast("Failed to add student", true);
        }
    });

    // ---------- EDIT STUDENT SYSTEM (Ctrl+Shift+E) ----------
    async function openEditStudent() {
        const pass = await promptModal("Edit Access", "Enter password:", "password");
        if (pass !== EDIT_PASSWORD) { toast("Wrong password", true); return; }
        const studentId = await promptModal("Edit Student", "Enter Student ID:", "text");
        if (!studentId) return;
        const docRef = doc(db, "students", studentId);
        const snap = await getDoc(docRef);
        if (!snap.exists()) { toast("No ID found", true); return; }
        const data = snap.data();
        // Fill edit modal
        document.getElementById('editStudentId').value = studentId;
        document.getElementById('editStudentName').value = data.name || "";
        document.getElementById('editStudentClass').value = data.class || "";
        document.getElementById('editStudentPhone').value = data.phone || "";
        const terms = data.terms || [];
        document.getElementById('editTerm1Total').value = terms[0]?.total || 0;
        document.getElementById('editTerm2Total').value = terms[1]?.total || 0;
        document.getElementById('editTerm3Total').value = terms[2]?.total || 0;
        const otherFees = data.otherFees || {};
        document.getElementById('editEcaFee').value = otherFees.eca?.monthlyAmount || 1250;
        document.getElementById('editAnnualDayTotal').value = otherFees.annualDay?.total || 750;
        const busFee = data.busFee;
        const busSection = document.getElementById('editBusFeeSection');
        if (busFee) {
            busSection.style.display = 'block';
            document.getElementById('editMonthlyBusFee').value = busFee.monthlyAmount || 0;
        } else {
            busSection.style.display = 'none';
        }
        showModal(document.getElementById('editStudentModal'));
        // Save handler
        const editForm = document.getElementById('editStudentForm');
        const saveHandler = async (e) => {
            e.preventDefault();
            const updatedName = document.getElementById('editStudentName').value.trim();
            const updatedClass = document.getElementById('editStudentClass').value;
            const updatedPhone = document.getElementById('editStudentPhone').value.trim();
            const newTermTotals = [
                parseFloat(document.getElementById('editTerm1Total').value),
                parseFloat(document.getElementById('editTerm2Total').value),
                parseFloat(document.getElementById('editTerm3Total').value)
            ];
            const updatedTerms = terms.map((t, idx) => ({ ...t, total: newTermTotals[idx] }));
            const updatedOther = {
                eca: { monthlyAmount: parseFloat(document.getElementById('editEcaFee').value), paidMonths: otherFees.eca?.paidMonths || [], partialPayments: otherFees.eca?.partialPayments || [] },
                annualDay: { total: parseFloat(document.getElementById('editAnnualDayTotal').value), paid: otherFees.annualDay?.paid || 0 }
            };
            const updateData = { name: updatedName, class: updatedClass, phone: updatedPhone, terms: updatedTerms, otherFees: updatedOther };
            if (busFee) {
                const newBusMonthly = parseFloat(document.getElementById('editMonthlyBusFee').value);
                updateData.busFee = { ...busFee, monthlyAmount: newBusMonthly };
            }
            await updateDoc(docRef, updateData);
            // Refresh local data
            const oldClass = data.class;
            if (oldClass !== updatedClass) {
                studentData[oldClass] = studentData[oldClass].filter(s => s.id !== studentId);
                if (!studentData[updatedClass]) studentData[updatedClass] = [];
                studentData[updatedClass].push({ name: updatedName, id: studentId });
            } else {
                const idx = studentData[oldClass].findIndex(s => s.id === studentId);
                if (idx !== -1) studentData[oldClass][idx].name = updatedName;
            }
            hideModal(document.getElementById('editStudentModal'));
            toast("Student updated");
            if (currentClass === updatedClass || currentClass === oldClass) {
                renderStudentList(studentData[currentClass] || [], currentClass);
            }
        };
        editForm.removeEventListener('submit', saveHandler);
        editForm.addEventListener('submit', saveHandler);
    }

    // ---------- UNIVERSAL EDIT (Ctrl+Shift+U) ----------
    async function openUniversalEdit() {
        const pass = await promptModal("Universal Access", "Enter universal password:", "password");
        if (pass !== UNIVERSAL_PASSWORD) { toast("Wrong password", true); return; }
        showModal(document.getElementById('universalModal'));
        const actionSelect = document.getElementById('universalAction');
        const dynamicDiv = document.getElementById('universalDynamic');
        function updateDynamic() {
            const action = actionSelect.value;
            if (action === 'updateEca') {
                dynamicDiv.innerHTML = `<div class="form-group"><label>New ECA Monthly Amount (₹)</label><input type="number" id="newEcaAmount" value="1250"></div>
                <div class="form-group"><label>Apply to</label><select id="applyScope"><option value="all">All Students</option><option value="class">Specific Class</option></select></div>
                <div id="classSelector" style="display:none;"><select id="targetClass"><option>Playschool</option><option>LKG</option><option>UKG</option><option>STD 1</option><option>STD 2</option><option>STD 3</option><option>STD 4</option><option>STD 5</option><option>STD 6</option><option>STD 7</option><option>STD 8</option><option>STD 9</option><option>STD 10</option></select></div>`;
            } else if (action === 'updateAnnual') {
                dynamicDiv.innerHTML = `<div class="form-group"><label>New Annual Day Total (₹)</label><input type="number" id="newAnnualAmount" value="750"></div>
                <div class="form-group"><label>Apply to</label><select id="applyScope"><option value="all">All Students</option><option value="class">Specific Class</option></select></div>
                <div id="classSelector" style="display:none;"><select id="targetClass"><option>Playschool</option><option>LKG</option><option>UKG</option><option>STD 1</option><option>STD 2</option><option>STD 3</option><option>STD 4</option><option>STD 5</option><option>STD 6</option><option>STD 7</option><option>STD 8</option><option>STD 9</option><option>STD 10</option></select></div>`;
            } else if (action === 'addNewFee') {
                dynamicDiv.innerHTML = `<div class="form-group"><label>Fee Name (camelCase)</label><input type="text" id="newFeeName" placeholder="e.g., sportsFee"></div>
                <div class="form-group"><label>Amount (₹)</label><input type="number" id="newFeeAmount"></div>
                <div class="form-group"><label>Type</label><select id="newFeeType"><option value="monthly">Monthly</option><option value="one-time">One-time</option></select></div>
                <div class="form-group"><label>Apply to</label><select id="applyScope"><option value="all">All Students</option><option value="class">Specific Class</option></select></div>
                <div id="classSelector" style="display:none;"><select id="targetClass"><option>Playschool</option><option>LKG</option><option>UKG</option><option>STD 1</option><option>STD 2</option><option>STD 3</option><option>STD 4</option><option>STD 5</option><option>STD 6</option><option>STD 7</option><option>STD 8</option><option>STD 9</option><option>STD 10</option></select></div>`;
            } else if (action === 'deleteFee') {
                // Get all dynamic fee keys from existing students (first student with otherFees)
                const sampleDoc = await getDocs(collection(db, "students"));
                let feeKeys = new Set();
                sampleDoc.forEach(docSnap => {
                    const fees = docSnap.data().otherFees;
                    if (fees) {
                        Object.keys(fees).forEach(k => { if (k !== 'eca' && k !== 'annualDay') feeKeys.add(k); });
                    }
                });
                const options = Array.from(feeKeys).map(k => `<option value="${k}">${k}</option>`).join('');
                dynamicDiv.innerHTML = `<div class="form-group"><label>Select Fee to Delete</label><select id="deleteFeeKey">${options}</select></div>
                <div class="form-group"><label>Apply to</label><select id="applyScope"><option value="all">All Students</option><option value="class">Specific Class</option></select></div>
                <div id="classSelector" style="display:none;"><select id="targetClass"><option>Playschool</option><option>LKG</option><option>UKG</option><option>STD 1</option><option>STD 2</option><option>STD 3</option><option>STD 4</option><option>STD 5</option><option>STD 6</option><option>STD 7</option><option>STD 8</option><option>STD 9</option><option>STD 10</option></select></div>`;
            }
            const scopeSelect = dynamicDiv.querySelector('#applyScope');
            if (scopeSelect) {
                scopeSelect.addEventListener('change', () => {
                    const classDiv = dynamicDiv.querySelector('#classSelector');
                    if (classDiv) classDiv.style.display = scopeSelect.value === 'class' ? 'block' : 'none';
                });
                scopeSelect.dispatchEvent(new Event('change'));
            }
        }
        actionSelect.addEventListener('change', updateDynamic);
        updateDynamic();
        const applyBtn = document.getElementById('applyUniversalBtn');
        const cancelUni = document.getElementById('cancelUniversalBtn');
        const closeUni = document.getElementById('closeUniversalModal');
        const closeHandler = () => hideModal(document.getElementById('universalModal'));
        cancelUni.onclick = closeHandler;
        closeUni.onclick = closeHandler;
        applyBtn.onclick = async () => {
            const action = actionSelect.value;
            const scope = dynamicDiv.querySelector('#applyScope')?.value || 'all';
            const targetClass = scope === 'class' ? dynamicDiv.querySelector('#targetClass')?.value : null;
            let studentsToUpdate = [];
            if (scope === 'all') {
                const snapshot = await getDocs(collection(db, "students"));
                snapshot.forEach(d => studentsToUpdate.push({ id: d.id, data: d.data() }));
            } else {
                const classStudents = studentData[targetClass] || [];
                for (const s of classStudents) {
                    const docRef = doc(db, "students", s.id);
                    const snap = await getDoc(docRef);
                    if (snap.exists()) studentsToUpdate.push({ id: s.id, data: snap.data() });
                }
            }
            if (action === 'updateEca') {
                const newAmount = parseFloat(dynamicDiv.querySelector('#newEcaAmount').value);
                if (isNaN(newAmount)) { toast("Invalid amount", true); return; }
                for (const student of studentsToUpdate) {
                    const other = student.data.otherFees || {};
                    if (!other.eca) other.eca = { monthlyAmount: 1250, paidMonths: [], partialPayments: [] };
                    other.eca.monthlyAmount = newAmount;
                    await updateDoc(doc(db, "students", student.id), { otherFees: other });
                }
                toast(`ECA fee updated for ${studentsToUpdate.length} students`);
            } else if (action === 'updateAnnual') {
                const newAmount = parseFloat(dynamicDiv.querySelector('#newAnnualAmount').value);
                if (isNaN(newAmount)) { toast("Invalid amount", true); return; }
                for (const student of studentsToUpdate) {
                    const other = student.data.otherFees || {};
                    if (!other.annualDay) other.annualDay = { total: 750, paid: 0 };
                    other.annualDay.total = newAmount;
                    await updateDoc(doc(db, "students", student.id), { otherFees: other });
                }
                toast(`Annual Day fee updated for ${studentsToUpdate.length} students`);
            } else if (action === 'addNewFee') {
                const feeName = dynamicDiv.querySelector('#newFeeName').value.trim();
                const amount = parseFloat(dynamicDiv.querySelector('#newFeeAmount').value);
                const feeType = dynamicDiv.querySelector('#newFeeType').value;
                if (!feeName || isNaN(amount)) { toast("Invalid fee name or amount", true); return; }
                const safeKey = feeName.replace(/\s/g, '');
                for (const student of studentsToUpdate) {
                    const other = student.data.otherFees || {};
                    if (other[safeKey]) {
                        const confirmOverwrite = confirm(`Fee "${safeKey}" already exists for ${student.data.name}. Overwrite amount only?`);
                        if (!confirmOverwrite) continue;
                        if (feeType === 'monthly') other[safeKey].monthlyAmount = amount;
                        else other[safeKey].total = amount;
                    } else {
                        if (feeType === 'monthly') {
                            other[safeKey] = { type: "monthly", monthlyAmount: amount, paidMonths: [], partialPayments: [] };
                        } else {
                            other[safeKey] = { type: "one-time", total: amount, paid: 0 };
                        }
                    }
                    await updateDoc(doc(db, "students", student.id), { otherFees: other });
                }
                toast(`Fee "${safeKey}" added/updated for ${studentsToUpdate.length} students`);
            } else if (action === 'deleteFee') {
                const feeKey = dynamicDiv.querySelector('#deleteFeeKey').value;
                if (!feeKey) { toast("No fee selected", true); return; }
                const confirmDel = confirm(`Delete "${feeKey}" from selected students? This action cannot be undone.`);
                if (!confirmDel) return;
                for (const student of studentsToUpdate) {
                    const other = student.data.otherFees || {};
                    if (other[feeKey]) {
                        delete other[feeKey];
                        await updateDoc(doc(db, "students", student.id), { otherFees: other });
                    }
                }
                toast(`Fee "${feeKey}" removed from ${studentsToUpdate.length} students`);
            }
            hideModal(document.getElementById('universalModal'));
        };
    }

    // Simple prompt modal (since we can't use window.prompt)
    function promptModal(title, placeholder, type = 'text') {
        return new Promise((resolve) => {
            const overlay = document.createElement('div');
            overlay.className = 'popup-overlay';
            overlay.innerHTML = `
                <div class="popup-card">
                    <div class="popup-close" id="promptClose">✖</div>
                    <h3>${title}</h3>
                    <div class="form-group">
                        <input type="${type}" id="promptInput" placeholder="${placeholder}">
                    </div>
                    <div class="modal-actions">
                        <button class="modal-btn" id="promptCancel">Cancel</button>
                        <button class="modal-btn primary" id="promptOk">OK</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            const close = () => overlay.remove();
            overlay.querySelector('#promptClose').onclick = close;
            overlay.querySelector('#promptCancel').onclick = close;
            overlay.querySelector('#promptOk').onclick = () => {
                const val = overlay.querySelector('#promptInput').value;
                close();
                resolve(val);
            };
        });
    }

    // ---------- HIDDEN GESTURE CONTROLS (Mobile) ----------
    function isSafeToTrigger() {
        const modals = [addStudentModal, document.getElementById('editStudentModal'), document.getElementById('universalModal'), verifyModal, passwordModal, contactModal];
        for (const m of modals) {
            if (m && m.classList.contains('active')) return false;
        }
        const activeEl = document.activeElement;
        if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'SELECT')) return false;
        return true;
    }

    let tapCount = 0;
    let lastTapTime = 0;
    let tapHoldTimer = null;
    const schoolNameElement = document.getElementById('schoolName');

    function resetTapGesture() {
        tapCount = 0;
        if (tapHoldTimer) clearTimeout(tapHoldTimer);
        tapHoldTimer = null;
    }

    schoolNameElement.addEventListener('touchstart', (e) => {
        if (!isSafeToTrigger()) return;
        const now = Date.now();
        if (now - lastTapTime < 400) {
            tapCount++;
        } else {
            tapCount = 1;
        }
        lastTapTime = now;
        if (tapCount === 3) {
            tapHoldTimer = setTimeout(() => {
                if (isSafeToTrigger()) {
                    toast("Admin Mode Activated", false);
                    openEditStudent();
                }
                resetTapGesture();
            }, 1500);
        }
    });
    schoolNameElement.addEventListener('touchend', () => {
        if (tapHoldTimer) {
            clearTimeout(tapHoldTimer);
            tapHoldTimer = null;
            tapCount = 0;
        }
    });
    schoolNameElement.addEventListener('touchcancel', resetTapGesture);

    let swipeUpDetected = false;
    let swipeTimeout = null;
    let startY = 0;
    let holdAfterSwipeTimer = null;

    function resetSwipeGesture() {
        swipeUpDetected = false;
        if (swipeTimeout) clearTimeout(swipeTimeout);
        if (holdAfterSwipeTimer) clearTimeout(holdAfterSwipeTimer);
        swipeTimeout = null;
        holdAfterSwipeTimer = null;
    }

    document.addEventListener('touchstart', (e) => {
        if (!isSafeToTrigger()) return;
        startY = e.touches[0].clientY;
    });
    document.addEventListener('touchend', (e) => {
        if (!isSafeToTrigger()) return;
        const endY = e.changedTouches[0].clientY;
        const diff = startY - endY;
        if (diff > 80) {
            swipeUpDetected = true;
            if (swipeTimeout) clearTimeout(swipeTimeout);
            swipeTimeout = setTimeout(() => {
                swipeUpDetected = false;
            }, 1000);
        }
    });
    document.addEventListener('touchstart', (e) => {
        if (swipeUpDetected && isSafeToTrigger()) {
            if (holdAfterSwipeTimer) clearTimeout(holdAfterSwipeTimer);
            holdAfterSwipeTimer = setTimeout(() => {
                if (isSafeToTrigger()) {
                    toast("Admin Mode Activated", false);
                    openUniversalEdit();
                }
                resetSwipeGesture();
            }, 1500);
        }
    });
    document.addEventListener('touchend', (e) => {
        if (holdAfterSwipeTimer) {
            clearTimeout(holdAfterSwipeTimer);
            holdAfterSwipeTimer = null;
            resetSwipeGesture();
        }
    });
    document.addEventListener('touchcancel', resetSwipeGesture);

    // Existing hidden triggers (Ctrl+Shift+E, Ctrl+Shift+U, Ctrl+Shift+N, long press)
    const passwordModal = document.getElementById('passwordModal');
    const addPasswordInput = document.getElementById('addPassword');
    const pwdError = document.getElementById('pwdError');
    const confirmPwdBtn = document.getElementById('confirmPwdBtn');
    const cancelPwdBtn = document.getElementById('cancelPwdBtn');
    const closePwdModal = document.getElementById('closePwdModal');

    function openAddStudentPassword() {
        showModal(passwordModal);
        addPasswordInput.value = '';
        pwdError.style.display = 'none';
    }
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'n') {
            e.preventDefault();
            openAddStudentPassword();
        }
        if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'e') {
            e.preventDefault();
            openEditStudent();
        }
        if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'u') {
            e.preventDefault();
            openUniversalEdit();
        }
    });
    let longPressTimer = null;
    schoolNameElement.addEventListener('touchstart', (e) => {
        if (!isSafeToTrigger()) return;
        longPressTimer = setTimeout(() => {
            if (isSafeToTrigger()) {
                toast("Admin Mode Activated", false);
                openAddStudentPassword();
            }
        }, 5000);
    });
    schoolNameElement.addEventListener('touchend', () => {
        if (longPressTimer) clearTimeout(longPressTimer);
    });
    schoolNameElement.addEventListener('touchcancel', () => {
        if (longPressTimer) clearTimeout(longPressTimer);
    });

    closePwdModal.addEventListener('click', () => hideModal(passwordModal));
    cancelPwdBtn.addEventListener('click', () => hideModal(passwordModal));
    confirmPwdBtn.addEventListener('click', () => {
        if (addPasswordInput.value === ADD_STUDENT_PASSWORD) {
            hideModal(passwordModal);
            document.getElementById('addStudentForm').reset();
            document.getElementById('studentId').value = '';
            showModal(addStudentModal);
        } else {
            pwdError.style.display = 'block';
        }
    });

    // ---------- Contact Developer (fixed) ----------
    const contactModal = document.getElementById('contactModal');
    const contactDevBtn = document.getElementById('contactDevBtn');
    const closeContactBtn = document.getElementById('closeContactBtn');
    const callBtn = document.getElementById('callBtn');
    const whatsappBtn = document.getElementById('whatsappBtn');
    const developerNumber = "8594009501";

    function openContactModal() { showModal(contactModal); }
    function closeContactModal() { hideModal(contactModal); }
    contactDevBtn.addEventListener('click', openContactModal);
    closeContactBtn.addEventListener('click', closeContactModal);
    callBtn.addEventListener('click', () => {
        window.location.href = `tel:${developerNumber}`;
        closeContactModal();
    });
    whatsappBtn.addEventListener('click', () => {
        window.open(`https://wa.me/${developerNumber}`, '_blank');
        closeContactModal();
    });
    contactModal.addEventListener('click', (e) => {
        if (e.target === contactModal) closeContactModal();
    });

    // ---------- Verify Receipt Modal (fixed loop) ----------
    const verifyModal = document.getElementById('verifyModal');
    const closeVerifyModal = document.getElementById('closeVerifyModal');
    const cancelVerifyBtn = document.getElementById('cancelVerifyBtn');
    const verifyBtn = document.getElementById('verifyBtn');
    const receiptCodeInput = document.getElementById('receiptCodeInput');
    const verifyResult = document.getElementById('verifyResult');
    document.getElementById('verifyReceiptBtn').addEventListener('click', () => {
        receiptCodeInput.value = '';
        verifyResult.innerHTML = '';
        showModal(verifyModal);
    });
    function closeVerify() { hideModal(verifyModal); }
    closeVerifyModal.addEventListener('click', closeVerify);
    cancelVerifyBtn.addEventListener('click', closeVerify);
    verifyBtn.addEventListener('click', async () => {
        const code = receiptCodeInput.value.trim().toUpperCase();
        if (!code) { verifyResult.innerHTML = '<p style="color:#bc4e2c;">Please enter a receipt code</p>'; return; }
        verifyResult.innerHTML = '<p>Searching...</p>';
        try {
            const snapshot = await getDocs(collection(db, "students"));
            let foundData = null;
            for (let i = 0; i < snapshot.docs.length; i++) {
                const docSnap = snapshot.docs[i];
                const data = docSnap.data();
                if (!data.receipts || !Array.isArray(data.receipts)) continue;
                const match = data.receipts.find(r => r.code === code);
                if (match) {
                    foundData = { studentName: data.name, className: data.class, ...match };
                    break;
                }
            }
            if (foundData) {
                verifyResult.innerHTML = `<div style="background:#e1f7ea; padding:1rem; border-radius:1rem; border-left:4px solid #4CAF50;">
                    <strong>Verified ✅</strong><br><br><b>Name:</b> ${escapeHtml(foundData.studentName)}<br>
                    <b>Class:</b> ${escapeHtml(foundData.className)}<br><b>Amount:</b> ₹${foundData.amount}<br>
                    <b>Term:</b> ${escapeHtml(foundData.term)}<br><b>Date:</b> ${foundData.date}<br><b>Code:</b> ${escapeHtml(foundData.code)}
                </div>`;
            } else {
                verifyResult.innerHTML = `<div style="background:#ffe6e5; padding:1rem; border-radius:1rem; border-left:4px solid #bc4e2c;">❌ Invalid Receipt Code</div>`;
            }
        } catch (err) {
            console.error(err);
            verifyResult.innerHTML = '<p style="color:#bc4e2c;">Error verifying receipt code</p>';
        }
    });

    // ---------- INIT (wrap in load event) ----------
    window.addEventListener('load', () => {
        init();
    });
    async function init() {
        await fetchAllStudents();
        renderClassGrid();
        classViewDiv.style.display = 'block';
        fullscreenStudentView.classList.remove('active');
        if (window.location.search) history.replaceState(null, "", window.location.pathname);
        const modals = [addStudentModal, document.getElementById('editStudentModal'), document.getElementById('universalModal'), verifyModal, passwordModal];
        modals.forEach(modal => {
            modal.addEventListener('click', (e) => { if (e.target === modal) hideModal(modal); });
        });
        document.getElementById('closeAddModal').onclick = () => hideModal(addStudentModal);
        document.getElementById('cancelAddBtn').onclick = () => hideModal(addStudentModal);
        document.getElementById('closeEditModal').onclick = () => hideModal(document.getElementById('editStudentModal'));
        document.getElementById('cancelEditBtn').onclick = () => hideModal(document.getElementById('editStudentModal'));
    }
</script>

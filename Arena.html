function appAlert(title, msg) {
  const m = overlay(`
    <button class="modal-close">✕</button>
    <div class="alert-card">
      <div class="alert-icon"><span class="material-symbols-rounded">error</span></div>
      <h3>${htmlEscape(title)}</h3>
      <p>${htmlEscape(msg)}</p>
      <div class="modal-actions" style="justify-content:center">
        <button class="btn-modal btn-modal-ok" id="a-ok">OK</button>
      </div>
    </div>`);
  m.querySelector("#a-ok").onclick = closeAllOverlays;
}

function closeAllOverlays() {
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.querySelectorAll(".overlay").forEach(o => {
    if (reduce) { o.remove(); return; }
    o.classList.add("closing");
    setTimeout(() => o.remove(), 240);
  });
}

function overlay(html, onDismiss) {
  closeAllOverlays();
  const ov = document.createElement("div");
  ov.className = "overlay";
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = html;
  ov.appendChild(m);
  document.body.appendChild(ov);

  const dismiss = () => {
    if (typeof onDismiss === "function") onDismiss();
    closeAllOverlays();
  };

  ov.addEventListener("click", e => { if (e.target === ov) dismiss(); });

  const cl = m.querySelector(".modal-close");
  if (cl) cl.onclick = dismiss;

  return m;
}

  sel.onchange = () => {
    amtRow.style.display = sel.value === "partial" ? "block" : "none";
  };

  m.querySelector("#m-cancel").onclick = closeAllOverlays;

  okBtn.onclick = async () => {
    const action = sel.value;
    const mode   = m.querySelector("#mode-sel").value;

    if (action === "full") {
      okBtn.disabled = true;
      closeAllOverlays();
      await applyPayment(feeType, identifier, 0, true, mode);
      return;
    }

    const rawVal = amtInp.value.trim();
    if (!rawVal)         { toast("Please enter an amount."); return; }
    const amount = parseFloat(rawVal);
    if (isNaN(amount))   { toast("Invalid amount. Please enter a number."); return; }
    if (amount === 0)    { toast("Amount must be non-zero."); return; }

    okBtn.disabled = true;
    closeAllOverlays();
    await applyPayment(feeType, identifier, amount, false, mode);
  };
}

/* ═══════════════════════════════════════════
   TOAST
═══════════════════════════════════════════ */
function toast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2700);
}

/* ═══════════════════════════════════════════
   DARK MODE
═══════════════════════════════════════════ */
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
}

function detectSystemTheme() {
  applyTheme(window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}

window.matchMedia("(prefers-color-scheme: dark)")
  .addEventListener("change", e => { applyTheme(e.matches ? "dark" : "light"); });

/* ═══════════════════════════════════════════
   STEALTH KEYBOARD SHORTCUTS
═══════════════════════════════════════════ */
let keys      = { a: false, d: false, e: false };
let comboLock = false;

document.addEventListener("keydown", e => {
  const tag = e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

  const k = e.key.toLowerCase();
  if (k === "a") keys.a = true;
  if (k === "d") keys.d = true;
  if (k === "e") keys.e = true;

  if (comboLock) return;

  if (keys.a && keys.d) {
    comboLock = true;
    openAdminAuth("add");
  } else if (keys.e && keys.d) {
    comboLock = true;
    openAdminAuth("edit");
  }
});

document.addEventListener("keyup", e => {
  const k = e.key.toLowerCase();
  if (k === "a") keys.a = false;
  if (k === "d") keys.d = false;
  if (k === "e") keys.e = false;
  comboLock = false;
});

window.addEventListener("blur", () => {
  keys.a = keys.d = keys.e = false;
  comboLock = false;
});

/* ═══════════════════════════════════════════
   UNIFIED ADMIN AUTH MODAL (Firebase) – PASSWORD ONLY
═══════════════════════════════════════════ */
function openAdminAuth(mode) {
  if (adminUser) {
    if (mode === "add") {
      adminSelectFeeType();
    } else {
      isAdminMode = true;
      openAdminEditSelector();
    }
    return;
  }

  const m = overlay(`
    <button class="modal-close">✕</button>
    <h3><span class="material-symbols-rounded">lock</span> Admin Login</h3>
    <div class="field">
      <input type="password" id="admin-pass" placeholder="Enter password" autocomplete="current-password">
      <label for="admin-pass">Password</label>
    </div>
    <div class="modal-actions">
      <button class="btn-modal btn-modal-cancel" id="m-cancel">Cancel</button>
      <button class="btn-modal btn-modal-ok"     id="m-ok">Login</button>
    </div>`);

  const passInput = m.querySelector("#admin-pass");
  const okBtn     = m.querySelector("#m-ok");
  passInput.focus();

  const attempt = async () => {
    const password = passInput.value;
    if (!password) {
      toast("Please enter password.");
      return;
    }
    okBtn.disabled = true;
    try {
      await signInWithEmailAndPassword(auth, ADMIN_EMAIL_1, password);
    } catch (err1) {
      try {
        await signInWithEmailAndPassword(auth, ADMIN_EMAIL_2, password);
      } catch (err2) {
        toast("Wrong password");
        okBtn.disabled = false;
        passInput.value = "";
        passInput.focus();
        return;
      }
    }
    closeAllOverlays();
    if (mode === "add") {
      adminSelectFeeType();
    } else {
      isAdminMode = true;
      openAdminEditSelector();
    }
  };

  m.querySelector("#m-cancel").onclick = closeAllOverlays;
  okBtn.onclick = attempt;
  passInput.addEventListener("keydown", e => {
    if (e.key === "Enter") attempt();
  });
}

/* ═══════════════════════════════════════════
   ADMIN EDIT SELECTOR
═══════════════════════════════════════════ */
function openAdminEditSelector() {
  const receipts = (SD.receipts || [])
    .filter(r => !r.status || r.status === "active")
    .slice()
    .reverse();

  if (!receipts.length) {
    toast("No active records to edit.");
    isAdminMode = false;
    return;
  }

  const options = receipts.map(r => {
    const safeCode = htmlEscape(r.code || "");
    const safeText = `${htmlEscape(r.subType || "—")} — ${fmtRs(r.amount)} (${htmlEscape(r.date || "—")})`;
    return `<option value="${safeCode}">${safeText}</option>`;
  }).join("");

  const resetAdmin = () => { isAdminMode = false; };

  const m = overlay(`
    <button class="modal-close">✕</button>
    <h3><span class="material-symbols-rounded">edit</span> Select Payment to Edit</h3>
    <div class="field">
      <label for="edit-select">Payment Record</label>
      <select id="edit-select">${options}</select>
    </div>
    <div class="modal-actions" style="justify-content:space-between">
      <button class="btn-modal btn-modal-cancel" style="background:transparent;color:var(--red);border:1px solid var(--red);padding:0.4rem 0.9rem;" id="m-signout"><span class="material-symbols-rounded">logout</span> Sign Out</button>
      <div style="display:flex;gap:0.5rem">
        <button class="btn-modal btn-modal-cancel" id="m-cancel">Cancel</button>
        <button class="btn-modal btn-modal-ok"     id="m-ok">Edit</button>
      </div>
    </div>`, resetAdmin);

  m.querySelector("#m-cancel").onclick = () => { resetAdmin(); closeAllOverlays(); };

  m.querySelector("#m-signout").onclick = async () => {
    closeAllOverlays();
    isAdminMode = false;
    await signOut(auth);
    toast("Signed out.");
  };

  m.querySelector("#m-ok").onclick = () => {
    const code = m.querySelector("#edit-select").value;
    closeAllOverlays();
    editPayment(code);
  };
}

function setView(v) {
  VIEW = v;
  el("tabTerm").classList.toggle("active",    v === "term");
  el("tabOther").classList.toggle("active",   v === "other");
  el("tabHistory").classList.toggle("active", v === "history");
  el("tabTerm").setAttribute("aria-selected",    v === "term");
  el("tabOther").setAttribute("aria-selected",   v === "other");
  el("tabHistory").setAttribute("aria-selected", v === "history");
  render();
}

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
function initRipple() {
  const sel = ".btn-action,.btn-modal,.btn-pay,.btn-help,.btn-upi-pay,.btn-wa,.btn-copy,.view-tab,.exp-header,.payment-card-header,.term-card-head";
  document.addEventListener("click", e => {
    const t = e.target.closest(sel);
    if (!t || t.disabled) return;
    const r = t.getBoundingClientRect();
    const size = Math.max(r.width, r.height);
    const span = document.createElement("span");
    span.className = "ripple";
    span.style.width = span.style.height = size + "px";
    span.style.left = (e.clientX - r.left - size / 2) + "px";
    span.style.top = (e.clientY - r.top - size / 2) + "px";
    t.appendChild(span);
    setTimeout(() => span.remove(), 600);
  }, { passive: true });
}

window.addEventListener("DOMContentLoaded", () => {
  detectSystemTheme();
  initRipple();

  el("logoutBtn").onclick = async () => {
    if (adminUser) {
      await signOut(auth);
    }
    location.href = "../index.html";
  };

  el("tabTerm").onclick    = () => setView("term");
  el("tabOther").onclick   = () => setView("other");
  el("tabHistory").onclick = () => setView("history");
  el("payBtn").onclick = () => {
    const b = el("payBtn");
    if (b.disabled) return;
    b.classList.add("is-loading");
    setTimeout(() => { b.classList.remove("is-loading"); openPay(); }, 320);
  };
  el("helpBtn").onclick    = openHelp;

  loadStudent();

  let longPressTimer = null;
  const nameEl = el("studentName");

  nameEl.addEventListener("touchstart", () => {
    longPressTimer = setTimeout(() => {
      longPressTimer = null;
      openAdminAuth("add");
    }, 1300);
  }, { passive: true });

  const cancelLongPress = () => {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  };
  nameEl.addEventListener("touchend",    cancelLongPress, { passive: true });
  nameEl.addEventListener("touchmove",   cancelLongPress, { passive: true });
  nameEl.addEventListener("touchcancel", cancelLongPress, { passive: true });
});

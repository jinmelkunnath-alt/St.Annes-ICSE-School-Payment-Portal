
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>St. Anne's ICSE | Fee Portal</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   ST. ANNE'S ICSE SCHOOL FEE PORTAL — APPLE iOS 27 / VISION OS LIQUID GLASS
   DESIGNED ACCORDING TO APPLE HUMAN INTERFACE GUIDELINES
═══════════════════════════════════════════════════════════════════════════ */

:root {
  --apple-blue: #0A84FF;
  --apple-blue-glow: rgba(10, 132, 255, 0.45);
  --apple-green: #30D158;
  --apple-green-glow: rgba(48, 209, 88, 0.4);
  --apple-orange: #FF9F0A;
  --apple-red: #FF453A;
  --apple-purple: #BF5AF2;
  --apple-teal: #64D2FF;
  
  --glass-bg: rgba(30, 35, 54, 0.65);
  --glass-bg-hover: rgba(45, 52, 78, 0.75);
  --glass-border: rgba(255, 255, 255, 0.16);
  --glass-border-light: rgba(255, 255, 255, 0.28);
  --glass-shadow: 0 24px 54px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.25);
  
  --text-primary: #FFFFFF;
  --text-secondary: rgba(255, 255, 255, 0.68);
  --text-tertiary: rgba(255, 255, 255, 0.45);
  
  --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

html {
  font-size: 16px;
  background-color: #070913;
  color: var(--text-primary);
  font-family: var(--font-stack);
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  background: radial-gradient(circle at 15% 20%, #151D3B 0%, #080A14 60%, #05070D 100%);
  position: relative;
  overflow-x: hidden;
  padding: 0;
  margin: 0;
}

/* ─── VISION OS AMBIENT LIGHT BLOBS ─── */
body::before, body::after {
  content: "";
  position: fixed;
  border-radius: 50%;
  filter: blur(100px);
  z-index: 0;
  pointer-events: none;
  animation: floatOrbs 16s infinite alternate ease-in-out;
}

body::before {
  width: 480px;
  height: 480px;
  background: radial-gradient(circle, rgba(10, 132, 255, 0.28) 0%, rgba(191, 90, 242, 0.18) 60%, transparent 100%);
  top: -100px;
  left: -100px;
}

body::after {
  width: 420px;
  height: 420px;
  background: radial-gradient(circle, rgba(48, 209, 88, 0.2) 0%, rgba(100, 210, 255, 0.15) 60%, transparent 100%);
  bottom: -80px;
  right: -80px;
  animation-delay: -8s;
}

@keyframes floatOrbs {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(60px, 40px) scale(1.15); }
  100% { transform: translate(-30px, 80px) scale(0.95); }
}

/* ─── DESKTOP REALISTIC iPHONE FRAME & FULL RESPONSIVE ─── */
@media (min-width: 768px) {
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  #app {
    width: 430px !important;
    max-width: 430px !important;
    min-height: 890px;
    margin: 0 auto;
    border-radius: 56px;
    border: 10px solid #1A1F30;
    box-shadow: 
      0 40px 100px rgba(0, 0, 0, 0.85),
      0 0 0 1px rgba(255, 255, 255, 0.12),
      inset 0 0 30px rgba(0, 0, 0, 0.6);
    position: relative;
    background: radial-gradient(circle at 50% 10%, #17203A 0%, #0A0D18 80%);
    overflow: hidden;
  }
}

#app {
  width: 100%;
  min-height: 100vh;
  position: relative;
  z-index: 1;
  padding: env(safe-area-inset-top, 24px) 20px calc(115px + env(safe-area-inset-bottom, 20px)) 20px;
  display: flex;
  flex-direction: column;
  transition: opacity 0.5s ease;
}

/* Hidden by default until JS sets visible */
#app:not(.visible) {
  opacity: 0;
}
#app.visible {
  opacity: 1;
  animation: appAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes appAppear {
  0% { opacity: 0; transform: scale(0.97) translateY(10px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

/* ─── SIMULATED iOS DYNAMIC ISLAND / STATUS BAR ─── */
.ios-status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 8px 18px;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: -0.2px;
  color: var(--text-primary);
  user-select: none;
}

.ios-time {
  font-weight: 700;
  width: 54px;
}

.dynamic-island {
  width: 114px;
  height: 30px;
  background: #000;
  border-radius: 20px;
  box-shadow: inset 0 0 2px rgba(255,255,255,0.25), 0 4px 12px rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 8px;
  position: relative;
  animation: islandPulse 4s infinite alternate ease-in-out;
}

.dynamic-island::after {
  content: "";
  width: 10px;
  height: 10px;
  background: #141414;
  border-radius: 50%;
  border: 1.5px solid #282828;
}

@keyframes islandPulse {
  0%, 90% { transform: scaleX(1); }
  95% { transform: scaleX(1.04); }
  100% { transform: scaleX(1); }
}

.ios-icons {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8rem;
}

/* ─── HEADER REDESIGN ─── */
.app-header {
  margin-bottom: 24px;
  position: relative;
  z-index: 10;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(35px) saturate(200%);
  -webkit-backdrop-filter: blur(35px) saturate(200%);
  border: 1px solid var(--glass-border);
  border-radius: 28px;
  padding: 14px 18px;
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.2);
}

.school-profile {
  display: flex;
  align-items: center;
  gap: 14px;
}

.school-avatar {
  width: 46px;
  height: 46px;
  border-radius: 16px;
  background: linear-gradient(135deg, #0A84FF, #0056B3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 1.15rem;
  color: #fff;
  position: relative;
  box-shadow: 0 8px 20px rgba(10, 132, 255, 0.4), inset 0 1px 1px rgba(255,255,255,0.4);
}

.school-info {
  display: flex;
  flex-direction: column;
}

.brand-name {
  font-size: 1.15rem;
  font-weight: 800;
  letter-spacing: -0.4px;
  background: linear-gradient(135deg, #FFF 0%, #A5C8FF 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.academic-year {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--apple-teal);
  margin-top: 2px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn-bell {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.16);
  color: #fff;
  font-size: 1.1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  transition: all 0.25s ease;
}

.btn-bell:hover {
  background: rgba(255, 255, 255, 0.15);
  transform: scale(1.06);
}

.notif-dot {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--apple-red);
  box-shadow: 0 0 8px var(--apple-red);
  animation: pulseDot 2s infinite ease-in-out;
}

@keyframes pulseDot {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.3); opacity: 0.7; }
}

.btn-logout {
  height: 42px;
  padding: 0 14px;
  border-radius: 14px;
  background: rgba(255, 69, 58, 0.15);
  border: 1px solid rgba(255, 69, 58, 0.35);
  color: #FF7B72;
  font-size: 0.85rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 4px 12px rgba(255, 69, 58, 0.15);
}

.btn-logout:hover {
  background: rgba(255, 69, 58, 0.25);
  transform: translateY(-2px);
  box-shadow: 0 8px 18px rgba(255, 69, 58, 0.3);
}

/* ─── STUDENT CARD & APPLE WATCH ACTIVITY RING ─── */
.student-card {
  position: relative;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03));
  backdrop-filter: blur(40px) saturate(210%);
  -webkit-backdrop-filter: blur(40px) saturate(210%);
  border: 1px solid var(--glass-border-light);
  border-radius: 34px;
  padding: 24px;
  margin-bottom: 24px;
  box-shadow: var(--glass-shadow);
  display: flex;
  align-items: center;
  justify-content: space-between;
  overflow: hidden;
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.student-card:hover {
  transform: translateY(-3px) scale(1.01);
}

.card-glass-reflection {
  position: absolute;
  top: 0;
  left: -100%;
  width: 60%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
  transform: skewX(-25deg);
  pointer-events: none;
  animation: crystalShine 8s infinite ease-in-out;
}

@keyframes crystalShine {
  0%, 80% { left: -100%; }
  100% { left: 150%; }
}

.student-profile-section {
  display: flex;
  align-items: center;
  gap: 16px;
}

.student-avatar-wrap {
  position: relative;
}

.student-avatar-img {
  width: 68px;
  height: 68px;
  border-radius: 22px;
  background: linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.05));
  border: 1.5px solid rgba(255,255,255,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.2rem;
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
}

.status-indicator {
  position: absolute;
  bottom: -2px;
  right: -2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--apple-green);
  border: 3px solid #101524;
  box-shadow: 0 0 10px var(--apple-green);
}

.student-details {
  display: flex;
  flex-direction: column;
}

.student-greeting {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.student-name {
  font-size: 1.45rem;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: #fff;
  margin: 3px 0 6px;
}

.student-tags .tag {
  display: inline-flex;
  align-items: center;
  padding: 5px 12px;
  border-radius: 100px;
  background: rgba(10, 132, 255, 0.22);
  border: 1px solid rgba(10, 132, 255, 0.45);
  color: #60B5FF;
  font-size: 0.76rem;
  font-weight: 700;
  letter-spacing: 0.3px;
  box-shadow: 0 4px 12px rgba(10, 132, 255, 0.25);
}

/* Apple Watch Style Activity Ring Progress */
.progress-block {
  min-width: 90px;
}

.progress-info-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.progress-label {
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.8px;
  color: var(--text-secondary);
  text-transform: uppercase;
  margin-bottom: 8px;
  text-align: center;
}

.progress-ring-wrap {
  position: relative;
  width: 82px;
  height: 82px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.progress-track {
  width: 82px;
  height: 82px;
  border-radius: 50%;
  background: radial-gradient(circle, #0B1120 54%, rgba(255,255,255,0.08) 56%);
  border: 5px solid rgba(255, 255, 255, 0.08);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(48, 209, 88, 0.2);
}

.progress-bar {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  background: linear-gradient(90deg, #30D158, #00F2FE);
  border-radius: 50%;
  opacity: 0.85;
  transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1), min-width 0.8s ease;
  filter: drop-shadow(0 0 10px #30D158);
}

.progress-pct {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 0.95rem;
  font-weight: 800;
  color: #30D158;
  text-shadow: 0 0 12px rgba(48, 209, 88, 0.8);
  letter-spacing: -0.5px;
  z-index: 10;
}

/* ─── FIXED iOS BOTTOM NAVIGATION ─── */
.view-tabs {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 36px);
  max-width: 400px;
  background: rgba(20, 24, 40, 0.78);
  backdrop-filter: blur(45px) saturate(220%);
  -webkit-backdrop-filter: blur(45px) saturate(220%);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 38px;
  box-shadow: 
    0 24px 60px rgba(0, 0, 0, 0.75),
    0 0 0 1px rgba(0, 0, 0, 0.4),
    inset 0 1.5px 1px rgba(255, 255, 255, 0.3);
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 8px 10px;
  z-index: 99999;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.view-tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 8px 4px;
  border: none;
  background: transparent;
  color: var(--text-tertiary);
  cursor: pointer;
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  border-radius: 28px;
  font-family: var(--font-stack);
}

.view-tab .nav-icon {
  font-size: 1.35rem;
  transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.view-tab .nav-label {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: -0.2px;
  transition: color 0.3s;
}

.view-tab .nav-pill {
  position: absolute;
  bottom: 2px;
  width: 20px;
  height: 3.5px;
  background: var(--apple-blue);
  border-radius: 4px;
  opacity: 0;
  transform: scaleX(0);
  transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 0 10px var(--apple-blue);
}

.view-tab.active {
  color: #fff;
  transform: translateY(-2px);
}

.view-tab.active .nav-icon {
  transform: scale(1.18);
  filter: drop-shadow(0 0 8px rgba(10, 132, 255, 0.6));
}

.view-tab.active .nav-label {
  color: var(--apple-blue);
  font-weight: 700;
}

.view-tab.active .nav-pill {
  opacity: 1;
  transform: scaleX(1);
}

/* ─── CONTENT AREA & TRANSITIONS ─── */
#content {
  flex: 1;
  animation: contentSlideIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes contentSlideIn {
  0% { opacity: 0; transform: translateY(14px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* ─── APPLE SETTINGS EXPANDABLE GROUPS ─── */
.exp-card {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(35px) saturate(180%);
  -webkit-backdrop-filter: blur(35px) saturate(180%);
  border: 1px solid var(--glass-border);
  border-radius: 28px;
  overflow: hidden;
  margin-bottom: 20px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease;
}

.exp-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 22px 50px rgba(0, 0, 0, 0.45), 0 0 20px rgba(255, 255, 255, 0.06);
}

.exp-header {
  padding: 20px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  transition: background 0.25s ease;
  user-select: none;
}

.exp-header:hover, .exp-header.open {
  background: rgba(255, 255, 255, 0.08);
}

.exp-header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.exp-icon {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.05));
  border: 1px solid rgba(255, 255, 255, 0.22);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
}

.exp-title {
  font-size: 1.12rem;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.3px;
}

.exp-subtitle {
  font-size: 0.82rem;
  color: var(--text-secondary);
  margin-top: 3px;
}

.exp-header-right {
  display: flex;
  align-items: center;
  gap: 14px;
}

.exp-summary {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--apple-blue);
  background: rgba(10, 132, 255, 0.16);
  padding: 5px 14px;
  border-radius: 100px;
  border: 1px solid rgba(10, 132, 255, 0.35);
  box-shadow: 0 0 12px rgba(10, 132, 255, 0.2);
}

.exp-arrow {
  font-size: 0.8rem;
  color: var(--text-tertiary);
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  display: inline-block;
}

.exp-arrow.open {
  transform: rotate(90deg) scale(1.2);
  color: var(--apple-blue);
}

.exp-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  background: rgba(0, 0, 0, 0.22);
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.exp-body-inner {
  padding: 20px;
}

/* ─── iOS LIST TABLE REDESIGN ─── */
.fee-table-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.fee-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0 10px;
}

.fee-table thead th {
  padding: 6px 14px 10px;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-tertiary);
  font-weight: 700;
  border: none;
}

.fee-table tbody tr {
  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(20px);
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.fee-table tbody tr:hover {
  background: rgba(255, 255, 255, 0.12);
  transform: scale(1.01) translateX(4px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
}

.fee-table tbody td {
  padding: 16px 14px;
  font-size: 0.95rem;
  color: #fff;
  border: none;
  vertical-align: middle;
}

.fee-table tbody tr td:first-child {
  border-top-left-radius: 16px;
  border-bottom-left-radius: 16px;
  font-weight: 600;
}

.fee-table tbody tr td:last-child {
  border-top-right-radius: 16px;
  border-bottom-right-radius: 16px;
}

/* Status Badges */
.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 6px 14px;
  border-radius: 100px;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  transition: all 0.3s ease;
}

.badge-paid {
  background: rgba(48, 209, 88, 0.18);
  color: var(--apple-green);
  border: 1px solid rgba(48, 209, 88, 0.45);
  box-shadow: 0 0 14px rgba(48, 209, 88, 0.25);
}

.badge-pending {
  background: rgba(255, 159, 10, 0.18);
  color: var(--apple-orange);
  border: 1px solid rgba(255, 159, 10, 0.45);
  box-shadow: 0 0 14px rgba(255, 159, 10, 0.25);
}

.blink-warn {
  animation: pulseWarning 1.5s infinite alternate ease-in-out;
  display: inline-block;
}

@keyframes pulseWarning {
  0% { transform: scale(1); opacity: 0.8; }
  100% { transform: scale(1.15); opacity: 1; }
}

/* ─── HISTORY VIEW ─── */
.filter-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(30px);
  padding: 14px 18px;
  border-radius: 22px;
  border: 1px solid var(--glass-border);
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.filter-label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-secondary);
}

.filter-select {
  padding: 8px 16px;
  border-radius: 14px;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #fff;

const QR_URL       = "https://raw.githubusercontent.com/jinmelkunnath-alt/St.Annes-ICSE-School-Payment-Portal/refs/heads/main/QR_IMG_01.png";
const MAX_RECEIPTS = 100;

const MONTH_ORDER = ["june","july","august","september","october","november","december","january","february","march"];

const TERM_NAMES = [
  "Term 1 (June – August)",
  "Term 2 (September – November)",
  "Term 3 (December – February)"
];

const FEE_ICONS = {
  bus:       "🚌", transport: "🚌",
  eca:       "🎨", arts:      "🎨", art: "🎨",
  annual:    "🎭", day:       "🎭",
  sports:    "🥇", games:     "🥇",
  lab:       "🧪", science:   "🧪",
  computer:  "💻", it:        "💻",
  library:   "📚", book:      "📚",
  music:     "🎵", dance:     "💃",
  uniform:   "👕", tuition:   "📖",
  exam:      "📝", id:        "🪪",
  picnic:    "🌳", trip:      "🌳",
  default:   "📋"
};

function iconFor(name) {
  if (!name) return FEE_ICONS.default;
  const lower = name.toLowerCase();
  for (const [key, icon] of Object.entries(FEE_ICONS)) {
    if (key !== "default" && lower.includes(key)) return icon;
  }
  return FEE_ICONS.default;
}

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
const safe  = v => { const n = Number(v); return isNaN(n) ? 0 : n; };
const el    = id  => document.getElementById(id);
const capF  = s   => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const fmtRs = n   => "₹" + safe(n).toLocaleString("en-IN");
const today = ()  => new Date().toISOString().slice(0, 10);

function htmlEscape(str) {
  if (str == null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function orderedEntries(obj) {
  return MONTH_ORDER
    .map(m => [m, (obj || {})[m]])
    .filter(([, v]) => v !== undefined);
}

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
const studentId = (new URLSearchParams(location.search).get("id") || "").trim().toLowerCase();
let SD          = {};
let TERMS       = [];
let VIEW        = "term";
let isAdminMode = false;

/* ═══════════════════════════════════════════
   LOADER
═══════════════════════════════════════════ */
function hideLoader() {
  el("app").classList.add("visible");
}

/* ═══════════════════════════════════════════
   NORMALISATION
═══════════════════════════════════════════ */
function normalizeTerms(raw) {
  const arr = Array.isArray(raw) ? raw : [];
  if (!arr.length) return TERM_NAMES.map(name => ({ name, total: 0, paid: 0 }));
  return arr.map((t, i) => ({
    name:  TERM_NAMES[i] || `Term ${i + 1}`,
    total: safe(t.total ?? 0),
    paid:  safe(t.paid  ?? 0)
  }));
}

function normalizeBusFee(raw) {
  if (!raw || typeof raw !== "object") return null;
  const src = (raw.monthly && typeof raw.monthly === "object") ? raw.monthly : raw;
  const monthly = {};
  Object.keys(src).forEach(k => {
    const v = src[k];
    monthly[k] = typeof v === "object"
      ? { total: safe(v.total ?? 0), paid: safe(v.paid ?? 0) }
      : { total: safe(v), paid: 0 };
  });
  if (!Object.keys(monthly).length) return null;
  return { monthly };
}

function normalizeEcaFee(raw) {
  if (raw && raw.monthly && typeof raw.monthly === "object") {
    let total = 0, paid = 0;
    Object.values(raw.monthly).forEach(m => { total += safe(m.total ?? 0); paid += safe(m.paid ?? 0); });
    return { total, paid };
  }
  if (!raw || typeof raw !== "object") return { total: 1250, paid: 0 };
  return { total: safe(raw.total ?? 1250), paid: safe(raw.paid ?? 0) };
}

function normalizeAnnualFee(raw) {
  if (!raw || typeof raw !== "object") return null;
  const total = safe(raw.total ?? 0);
  if (!total) return null;
  return { total, paid: safe(raw.paid ?? 0) };
}

function normalizeOtherFees(raw) {
  if (!Array.isArray(raw)) return [];
  return raw
    .filter(f => f && f.name)
    .filter(f => f.name.toLowerCase() !== "eca")
    .map(f => {
      const type = (f.type || "one-time").toLowerCase();
      if (type === "monthly" && f.monthly && typeof f.monthly === "object") {
        const monthly = {};
        Object.keys(f.monthly).forEach(k => {
          const v = f.monthly[k];
          monthly[k] = typeof v === "object"
            ? { total: safe(v.total ?? 0), paid: safe(v.paid ?? 0) }
            : { total: safe(v), paid: 0 };
        });
        return { name: f.name, type: "monthly", monthly };
      }
      const total = safe(f.total ?? 0);
      if (!total) return null;
      return { name: f.name, type: "one-time", total, paid: safe(f.paid ?? 0) };
    })
    .filter(Boolean);
}

function normalizePreviousYearFees(raw) {
  if (!raw || typeof raw !== "object") return null;
  const out = {};
  ["tuition","bus"].forEach(k => {
    if (raw[k] && typeof raw[k] === "object") {
      out[k] = {
        total: safe(raw[k].total ?? 0),
        paid:  safe(raw[k].paid  ?? 0)
      };
    }
  });
  return Object.keys(out).length ? out : null;
}

function enforceDefaults() {
  if (!SD.terms)     SD.terms     = normalizeTerms([]);
  if (!SD.ecaFee)    SD.ecaFee    = { total: 1250, paid: 0 };
  if (!SD.otherFees) SD.otherFees = [];
  if (!SD.receipts)  SD.receipts  = [];
  if (SD.previousYearFees === undefined) SD.previousYearFees = null;
  if (!Array.isArray(TERMS)) TERMS = [];
}

/* ═══════════════════════════════════════════
   LOAD
═══════════════════════════════════════════ */
async function loadStudent() {
  if (!studentId) {
    alert("No student ID in URL.\nExample: ?id=john001");
    hideLoader();
    return;
  }
  try {
    const snap = await getDoc(doc(db, "students", studentId));
    if (!snap.exists()) {
      alert(`Student not found: "${studentId}"`);
      hideLoader();
      return;
    }
    const raw = snap.data();
    SD = {
      name:      raw.name  || "Unknown",
      class:     String(raw.class || "—").toUpperCase(),
      phone:     raw.phone || "",
      receipts:  Array.isArray(raw.receipts) ? raw.receipts : [],
      terms:     normalizeTerms(raw.terms),
      busFee:    normalizeBusFee(raw.busFee),
      ecaFee:    normalizeEcaFee(raw.ecaFee || raw.eca),
      annualFee: normalizeAnnualFee(raw.annualFee),
      otherFees: normalizeOtherFees(raw.otherFees)
    };
    SD.previousYearFees = normalizePreviousYearFees(raw.previousYearFees);
    enforceDefaults();
    TERMS = SD.terms;

    el("studentName").textContent = SD.name;
    el("studentTags").innerHTML   = `<span class="tag">📖 Class ${htmlEscape(SD.class)}</span>`;

    render();
    hideLoader();
  } catch (err) {
    console.error("🔥 Firestore load error:", err);
    alert("Error loading student: " + err.message);
    hideLoader();
  }
}

/* ═══════════════════════════════════════════
   TOTALS
═══════════════════════════════════════════ */
function calcTermTotals() {
  let total = 0, paid = 0;
  TERMS.forEach(t => { total += safe(t.total); paid += safe(t.paid); });
  return { total, paid, remaining: total - paid };
}

function calcOtherTotals() {
  let total = 0, paid = 0;
  if (SD.busFee) {
    Object.values(SD.busFee.monthly).forEach(m => { total += safe(m.total); paid += safe(m.paid); });
  }
  total += safe(SD.ecaFee.total); paid += safe(SD.ecaFee.paid);
  if (SD.annualFee) { total += safe(SD.annualFee.total); paid += safe(SD.annualFee.paid); }
  SD.otherFees.forEach(f => {
    if (f.type === "monthly") {
      Object.values(f.monthly).forEach(m => { total += safe(m.total); paid += safe(m.paid); });
    } else {
      total += safe(f.total); paid += safe(f.paid);
    }
  });
  return { total, paid, remaining: total - paid };
}

function calcPreviousYearTotals() {
  let total = 0, paid = 0;
  if (SD.previousYearFees) {
    if (SD.previousYearFees.tuition) { total += safe(SD.previousYearFees.tuition.total); paid += safe(SD.previousYearFees.tuition.paid); }
    if (SD.previousYearFees.bus)     { total += safe(SD.previousYearFees.bus.total);     paid += safe(SD.previousYearFees.bus.paid); }
  }
  return { total, paid, remaining: total - paid };
}

function getGrandTotals() {
  const t = calcTermTotals();
  const o = calcOtherTotals();
  const p = calcPreviousYearTotals();
  return {
    total:     t.total     + o.total     + p.total,
    paid:      t.paid      + o.paid      + p.paid,
    remaining: t.remaining + o.remaining + p.remaining
  };
}

/* ═══════════════════════════════════════════
   PROGRESS
═══════════════════════════════════════════ */
function updateProgress(total, paid) {
  const pct = safe(total) > 0 ? Math.min(100, (safe(paid) / safe(total)) * 100) : 0;
  el("progressBlock").style.display = "block";
  el("progressBar").style.width     = pct + "%";
  el("progressBar").style.minWidth  = pct > 0 ? "5px" : "0";
  el("progressPct").textContent     = Math.round(pct) + "%";
  el("progressLabel").textContent   = VIEW === "term" ? "TERM FEES PAID" : "OTHER FEES PAID";
}

/* ═══════════════════════════════════════════
   SUMMARY BAR
═══════════════════════════════════════════ */
function renderSummary(total, paid, remaining) {
  el("summaryBar").innerHTML = `
    <div class="summary-item">
      <span class="summary-label">Total</span>
      <span class="summary-value">${fmtRs(total)}</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">Paid</span>
      <span class="summary-value green">${fmtRs(paid)}</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">Remaining</span>
      <span class="summary-value ${remaining > 0 ? "red" : "green"}">${fmtRs(remaining)}</span>
    </div>`;
}

/* ═══════════════════════════════════════════
   FEE TABLE BUILDER
═══════════════════════════════════════════ */
function buildFeeTable(rows) {
  const trs = rows.map(r => {
    const rem    = safe(r.total) - safe(r.paid);
    const isPaid = rem <= 0;
    return `<tr>
      <td style="text-align:left">${htmlEscape(r.label)}</td>
      <td>${fmtRs(r.total)}</td>
      <td>${fmtRs(r.paid)}</td>
      <td>${fmtRs(rem)}</td>
      <td><span class="badge ${isPaid ? "badge-paid" : "badge-pending"}">${isPaid ? "Paid" : "Pending"}</span></td>
    </tr>`;
  }).join("");
  return `<div class="fee-table-scroll"><table class="fee-table">
    <thead><tr>
      <th style="text-align:left">Fee Item</th>
      <th>Total</th><th>Paid</th><th>Remaining</th><th>Status</th>
    </tr></thead>
    <tbody>${trs || `<tr><td colspan="5" style="text-align:center;padding:1.5rem;color:#8a9bb0">No data</td></tr>`}</tbody>
  </table></div>`;
}

/* ═══════════════════════════════════════════
   EXPANDABLE CARD BUILDER
═══════════════════════════════════════════ */
let openCard = null;

function buildExpCard({ id, icon, title, subtitle, rows }) {
  const card = document.createElement("div");
  card.className = "exp-card";

  card.innerHTML = `
    <div class="exp-header" id="hdr-${id}">
      <div class="exp-header-left">
        <span class="exp-icon">${icon}</span>
        <div>
          <div class="exp-title">${htmlEscape(title)}</div>
          ${subtitle ? `<div class="exp-subtitle">${htmlEscape(subtitle)}</div>` : ""}
        </div>
      </div>
      <div class="exp-header-right">
        <span class="exp-summary" id="sum-${id}"></span>
        <span class="exp-arrow" id="arr-${id}">▶</span>
      </div>
    </div>
    <div class="exp-body" id="body-${id}">
      <div class="exp-body-inner">${buildFeeTable(rows)}</div>
    </div>`;

  updateCardSummary(card, rows, id);

  const hdr  = card.querySelector(`#hdr-${id}`);
  const body = card.querySelector(`#body-${id}`);
  const arr  = card.querySelector(`#arr-${id}`);

  hdr.addEventListener("click", () => {
    const isOpen = arr.classList.contains("open");
    if (openCard && openCard !== card) {
      const ob = openCard.querySelector(".exp-body");
      const oa = openCard.querySelector(".exp-arrow");
      const oh = openCard.querySelector(".exp-header");
      if (ob) ob.style.maxHeight = "0";
      if (oa) oa.classList.remove("open");
      if (oh) oh.classList.remove("open");
    }
    if (isOpen) {
      body.style.maxHeight = "0";
      arr.classList.remove("open");
      hdr.classList.remove("open");
      openCard = null;
    } else {
      body.style.willChange = "max-height";
      requestAnimationFrame(() => {
        const inner = body.querySelector(".exp-body-inner");
        const targetHeight = inner ? inner.scrollHeight : 400;
        body.style.maxHeight = targetHeight + "px";
      });
      arr.classList.add("open");
      hdr.classList.add("open");
      openCard = card;
      const onTransitionEnd = () => {
        body.style.willChange = "auto";
        body.removeEventListener("transitionend", onTransitionEnd);
      };
      body.addEventListener("transitionend", onTransitionEnd, { once: true });
    }
  });

  return card;
}

function updateCardSummary(card, rows, id) {
  const sumEl = card.querySelector(`#sum-${id}`);
  if (!sumEl) return;
  const totalP  = rows.reduce((a, r) => a + safe(r.paid),  0);
  const totalT  = rows.reduce((a, r) => a + safe(r.total), 0);
  const allPaid = rows.every(r => safe(r.total) - safe(r.paid) <= 0);
  sumEl.innerHTML = allPaid
    ? `<span class="badge badge-paid">Paid</span>`
    : `<span style="font-size:0.75rem;color:var(--muted)">${fmtRs(totalP)} / ${fmtRs(totalT)}</span>`;
}

/* ═══════════════════════════════════════════
   RENDER
═══════════════════════════════════════════ */
function render() {
  enforceDefaults();
  openCard = null;
  const container = el("content");
  container.innerHTML = "";

  let termTotal=0, termPaid=0, otherTotal=0, otherPaid=0;
  if (VIEW === "term") {
    renderTermView(container);
    const t = calcTermTotals();
    termTotal = t.total; termPaid = t.paid;
    updateProgress(t.total, t.paid);
  } else if (VIEW === "other") {
    renderOtherView(container);
    const o = calcOtherTotals();
    otherTotal = o.total; otherPaid = o.paid;
    updateProgress(o.total, o.paid);
  } else {
    renderHistoryView(container);
    const t = calcTermTotals();
    const o = calcOtherTotals();
    termTotal = t.total; termPaid = t.paid;
    otherTotal = o.total; otherPaid = o.paid;
    el("progressBlock").style.display = "none";
  }
  const p = calcPreviousYearTotals();
  const g = { total: termTotal + otherTotal + p.total, paid: termPaid + otherPaid + p.paid, remaining: termTotal + otherTotal + p.total - (termPaid + otherPaid + p.paid) };
  renderSummary(g.total, g.paid, g.remaining);

  el("payBtn").disabled = g.remaining <= 0;
}

function renderTermView(container) {
  const rows = TERMS.map(t => ({ label: t.name, total: t.total, paid: t.paid }));
  const wrap = document.createElement("div");
  wrap.className = "term-table-wrap";
  wrap.innerHTML = buildFeeTable(rows);
  container.appendChild(wrap);
}

function renderOtherView(container) {
  const list = document.createElement("div");
  list.className = "sections-list";
  let anySection = false;

  if (SD.busFee) {
    const entries = orderedEntries(SD.busFee.monthly);
    const rows    = entries.map(([m, v]) => ({ label: capF(m), total: safe(v.total), paid: safe(v.paid) }));
    list.appendChild(buildExpCard({
      id: "bus", icon: iconFor("bus"),
      title: "Bus Fees",
      subtitle: `${MONTH_ORDER.filter(m => SD.busFee.monthly[m]).length} months`,
      rows
    }));
    anySection = true;
  }

  {
    const rows = [{ label: "ECA Fee", total: safe(SD.ecaFee.total), paid: safe(SD.ecaFee.paid) }];
    list.appendChild(buildExpCard({
      id: "eca", icon: iconFor("eca"),
      title: "ECA Fees",
      subtitle: "Extra-Curricular Activities",
      rows
    }));
    anySection = true;
  }

  if (SD.annualFee && safe(SD.annualFee.total) > 0) {
    const rows = [{ label: "Annual Day Fee", total: safe(SD.annualFee.total), paid: safe(SD.annualFee.paid) }];
    list.appendChild(buildExpCard({
      id: "annual", icon: iconFor("annual"),
      title: "Annual Day Fee", subtitle: "", rows
    }));
    anySection = true;
  }

  SD.otherFees.forEach((fee, idx) => {
    let rows = [];
    if (fee.type === "monthly") {
      const entries = orderedEntries(fee.monthly);
      rows = entries.map(([m, v]) => ({ label: capF(m), total: safe(v.total), paid: safe(v.paid) }));
    } else {
      rows = [{ label: fee.name, total: safe(fee.total), paid: safe(fee.paid) }];
    }
    if (!rows.reduce((a, r) => a + r.total, 0)) return;
    list.appendChild(buildExpCard({
      id:       `custom-${idx}`,
      icon:     iconFor(fee.name),
      title:    fee.name,
      subtitle: fee.type === "monthly" ? "Monthly fee" : "One-time fee",
      rows
    }));
    anySection = true;
  });

  if (!anySection) {
    list.innerHTML = `<p style="padding:2.5rem;text-align:center;color:var(--muted);font-size:0.9rem;">No other fees configured.</p>`;
  }
  container.appendChild(list);

  /* ─────────── Previous Year Pending Fees (expandable card) ─────────── */
  if (SD.previousYearFees && (SD.previousYearFees.tuition || SD.previousYearFees.bus)) {
    const rows = [];
    if (SD.previousYearFees.tuition) rows.push({
      label: "Previous Year Tuition Fee",
      total: safe(SD.previousYearFees.tuition.total),
      paid:  safe(SD.previousYearFees.tuition.paid)
    });
    if (SD.previousYearFees.bus) rows.push({
      label: "Previous Year Bus Fee",
      total: safe(SD.previousYearFees.bus.total),
      paid:  safe(SD.previousYearFees.bus.paid)
    });

    const totalT = rows.reduce((a, r) => a + r.total, 0);
    const totalP = rows.reduce((a, r) => a + r.paid, 0);
    const remaining = totalT - totalP;

    const iconHtml = remaining > 0
      ? `<span class="blink-warn">⚠️</span>`
      : `✅`;

    const card = buildExpCard({
      id: "previous-year",
      icon: iconHtml,
      title: "Previous Year Pending Fees",
      subtitle: remaining > 0 ? "Arrears pending" : "All arrears cleared",
      rows
    });
    container.appendChild(card);
  }
}

/* ═══════════════════════════════════════════
   HISTORY VIEW
═══════════════════════════════════════════ */
function renderHistoryView(container) {
  const activeReceipts = (SD.receipts || [])
    .filter(r => !r.status || r.status === "active")
    .slice()
    .reverse();

  if (!activeReceipts.length) {
    const wrap = document.createElement("div");
    wrap.className = "term-table-wrap";
    wrap.innerHTML = `
      <div class="hist-empty">
        <div class="hist-empty-icon">📋</div>
        <div class="hist-empty-title">No payment history yet</div>
        <div class="hist-empty-sub">Payments will appear here after recording</div>
      </div>`;
    container.appendChild(wrap);
    return;
  }

  const filterBar = document.createElement("div");
  filterBar.className = "filter-bar";
  filterBar.innerHTML = `
    <span class="filter-label">Filter:</span>
    <select class="filter-select" id="hist-filter">
      <option value="all">All Types</option>
      <option value="term">Term</option>
      <option value="bus">Bus</option>
      <option value="eca">ECA</option>
      <option value="annual">Annual</option>
      <option value="other">Other</option>
      <option value="previous">Previous Year</option>
    </select>
    <span class="hist-count" id="hist-count">${activeReceipts.length} record${activeReceipts.length !== 1 ? "s" : ""}</span>`;
  container.appendChild(filterBar);

  const tableWrap = document.createElement("div");
  tableWrap.className = "term-table-wrap";
  container.appendChild(tableWrap);

  function renderTable(filterType) {
    let filtered;
    if (filterType === "all") {
      filtered = activeReceipts;
    } else if (filterType === "previous") {
      filtered = activeReceipts.filter(r => r.type === "previous_tuition" || r.type === "previous_bus");
    } else {
      filtered = activeReceipts.filter(r => r.type === filterType);
    }

    const countEl = document.getElementById("hist-count");
    if (countEl) countEl.textContent = `${filtered.length} record${filtered.length !== 1 ? "s" : ""}`;

    if (!filtered.length) {
      tableWrap.innerHTML = `
        <div class="hist-empty">
          <div class="hist-empty-icon">🔍</div>
          <div class="hist-empty-title">No records for this filter</div>
          <div class="hist-empty-sub">Try selecting "All Types"</div>
        </div>`;
      return;
    }

    const rows = filtered.map(r => {
      const amt    = safe(r.amount);
      const amtCls = amt < 0 ? "color:var(--red)" : "color:var(--green)";
      return `<tr>
        <td style="text-align:left">
          <div class="hist-code-cell">
            <div class="hist-label">${htmlEscape(r.subType || "—")}</div>
            <div class="hist-code-text">${htmlEscape(r.code || "—")}</div>
          </div>
        </td>
        <td style="${amtCls};font-weight:700">${fmtRs(amt)}</td>
        <td style="font-size:0.8rem;white-space:nowrap">${htmlEscape(r.date || "—")}</td>
        <td style="font-size:0.75rem;white-space:nowrap">${(r.mode || "upi") === "cash" ? "💵 Cash" : "📲 UPI"}</td>
      </tr>`;
    }).join("");

    tableWrap.innerHTML = `
      <div class="fee-table-scroll">
        <table class="fee-table">
          <thead><tr>
            <th style="text-align:left">Fee / Receipt Code</th>
            <th>Amount</th>
            <th>Date</th>
            <th>Mode</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  renderTable("all");
  filterBar.querySelector("#hist-filter").addEventListener("change", function () {
    renderTable(this.value);
  });
}

/* ═══════════════════════════════════════════
   FIRESTORE SAVES
═══════════════════════════════════════════ */

function receiptCode(name, cls, subType, amount) {
  const words    = name.trim().split(/\s+/);
  const initials = words.length === 1
    ? words[0][0].toUpperCase() + "X"
    : words.slice(0, 2).map(w => w[0]).join("").toUpperCase();
  const cn    = cls.replace(/\D/g, "");
  const tn    = (subType.match(/\d+/) || ["0"])[0];
  const ap    = String(Math.abs(amount)).slice(0, 2);
  const seq   = Date.now().toString().slice(-6) + Math.random().toString(36).slice(2, 4).toUpperCase();
  const idSfx = ((studentId.match(/\d+/) || ["0"])[0]).padStart(3, "0");
  return `${initials}${cn}${tn}${ap}${seq}${idSfx}`;
}

async function renderReceiptImg(data) {

}

/* ═══════════════════════════════════════════
   PAYMENT HANDLER (admin only)
═══════════════════════════════════════════ */
async function applyPayment(feeType, identifier, amount, isFull, mode = "upi") {
  if (!adminUser) {
    toast("Admin login required.");
    return false;
  }
  enforceDefaults();
  let item = null, subType = "";

  if (feeType === "term") {
    const idx = parseInt(identifier);
    if (isNaN(idx) || !TERMS[idx]) { alert("Invalid term"); return false; }
    item = TERMS[idx]; subType = item.name;

  } else if (feeType === "bus") {
    if (!SD.busFee) { alert("Bus fee not configured"); return false; }
    const m = identifier;
    if (!SD.busFee.monthly[m]) SD.busFee.monthly[m] = { total: 0, paid: 0 };
    item = SD.busFee.monthly[m];
    subType = `Bus Fee – ${capF(m)}`;

  } else if (feeType === "eca") {
    item = SD.ecaFee; subType = "ECA Fee";

  } else if (feeType === "annual") {
    if (!SD.annualFee) { alert("Annual fee not configured"); return false; }
    item = SD.annualFee; subType = "Annual Day Fee";

  } else if (feeType === "other") {
    const parts = String(identifier).split(":");
    if (parts.length === 2) {
      const fIdx  = parseInt(parts[0]);
      const month = parts[1];
      const fee   = SD.otherFees[fIdx];
      if (!fee || !month) { alert("Fee not found"); return false; }
      if (!fee.monthly[month]) fee.monthly[month] = { total: 0, paid: 0 };
      item    = fee.monthly[month];
      subType = `${fee.name} – ${capF(month)}`;
    } else {
      const idx = parseInt(identifier);
      if (isNaN(idx) || !SD.otherFees[idx]) { alert("Fee not found"); return false; }
      item    = SD.otherFees[idx];
      subType = item.name;
    }

  } else if (feeType === "previous_tuition") {
    if (!SD.previousYearFees?.tuition) { alert("Previous year tuition not configured"); return false; }
    item = SD.previousYearFees.tuition;
    subType = "Previous Year Tuition Fee";

  } else if (feeType === "previous_bus") {
    if (!SD.previousYearFees?.bus) { alert("Previous year bus not configured"); return false; }
    item = SD.previousYearFees.bus;
    subType = "Previous Year Bus Fee";

  } else {
    alert("Unknown fee type"); return false;
  }

  if (!item || item.total === undefined) { alert("Fee has no total set"); return false; }

  const currentPaid = safe(item.paid);
  const totalAmt    = safe(item.total);
  const newPaid     = isFull
    ? totalAmt
    : Math.max(0, Math.min(totalAmt, currentPaid + safe(amount)));
  const delta       = newPaid - currentPaid;

  if (delta === 0) {
    toast("No change — paid amount is already at this value.");
    return false;
  }

  const prevPaid             = safe(item.paid);
  const prevReceiptsSnapshot = (SD.receipts || []).map(r => ({ ...r }));

  item.paid = newPaid;

  const absAmount = Math.abs(delta);
  const code      = receiptCode(SD.name, SD.class, subType, absAmount);
  const recObj    = { code, amount: delta, type: feeType, subType, date: today(), status: "active", mode };

  if (!Array.isArray(SD.receipts)) SD.receipts = [];
  SD.receipts.push(recObj);
  if (SD.receipts.length > MAX_RECEIPTS) SD.receipts = SD.receipts.slice(-MAX_RECEIPTS);

  const updateData = { receipts: SD.receipts };
  if      (feeType === "term")   updateData.terms     = TERMS;
  else if (feeType === "bus")    updateData.busFee    = SD.busFee;
  else if (feeType === "eca")    updateData.ecaFee    = { total: safe(SD.ecaFee.total), paid: safe(SD.ecaFee.paid) };
  else if (feeType === "annual") updateData.annualFee = SD.annualFee;
  else if (feeType === "other")  updateData.otherFees = SD.otherFees;
  else if (feeType === "previous_tuition" || feeType === "previous_bus") updateData.previousYearFees = SD.previousYearFees;

  try {
    await updateDoc(dbRef(), updateData);
  } catch (err) {
    item.paid   = prevPaid;
    SD.receipts = prevReceiptsSnapshot;
    toast("Error saving payment: " + err.message);
    console.error("applyPayment error:", err);
    render();
    return false;
  }

  render();
  await showSuccess(subType, absAmount, code);
  return true;
}

function getFeeItemByReceipt(receipt) {
  const { type, subType } = receipt;

  if (type === "term") {
    const term = TERMS.find(t => t.name === subType);
    return term ? { item: term } : null;
  }
  if (type === "bus") {
    const dashIdx = subType.indexOf("–");
    const month   = dashIdx !== -1 ? subType.slice(dashIdx + 1).trim().toLowerCase() : "";
    if (!month || !SD.busFee?.monthly[month]) return null;
    return { item: SD.busFee.monthly[month] };
  }
  if (type === "eca")    return SD.ecaFee    ? { item: SD.ecaFee }    : null;
  if (type === "annual") return SD.annualFee ? { item: SD.annualFee } : null;
  if (type === "other") {
    const dashIdx = subType.indexOf("–");
    if (dashIdx !== -1) {
      const feeName = subType.slice(0, dashIdx).trim();
      const month   = subType.slice(dashIdx + 1).trim().toLowerCase();
      const fee     = SD.otherFees.find(f => f.name === feeName);
      if (!fee || !fee.monthly?.[month]) return null;
      return { item: fee.monthly[month] };
    }
    const fee = SD.otherFees.find(f => f.name === subType);
    return fee ? { item: fee } : null;
  }
  if (type === "previous_tuition") return SD.previousYearFees?.tuition ? { item: SD.previousYearFees.tuition } : null;
  if (type === "previous_bus")     return SD.previousYearFees?.bus     ? { item: SD.previousYearFees.bus }     : null;

  return null;
}

function editPayment(code) {
  if (!isAdminMode) { toast("Unauthorized access."); return; }
  if (!code)        { toast("Invalid receipt code."); return; }

  const receipt = (SD.receipts || []).find(
    r => r.code === code && (!r.status || r.status === "active")
  );
  if (!receipt) { toast("Receipt not found or already cancelled."); return; }

  const feeRef = getFeeItemByReceipt(receipt);
  if (!feeRef)  { toast("Cannot locate fee record. Contact admin."); return; }

  const { item }     = feeRef;
  const oldAmt       = safe(receipt.amount);
  const currentPaid  = safe(item.paid);
  const total        = safe(item.total);
  const revertedPaid = Math.max(0, currentPaid - oldAmt);
  const maxAllowed   = Math.max(0, total - revertedPaid);

  const resetAdmin = () => { isAdminMode = false; };

  const m = overlay(`
    <button class="modal-close">✕</button>
    <h3>✏ Edit Payment</h3>
    <div class="edit-info-box">
      <div class="edit-info-fee">${htmlEscape(receipt.subType || "—")}</div>
      <div class="edit-info-meta">Recorded: ${fmtRs(oldAmt)} &nbsp;·&nbsp; Date: ${htmlEscape(receipt.date || "—")}</div>
      <div class="edit-info-code">${htmlEscape(receipt.code)}</div>
    </div>
    <label>New Amount (₹)</label>
    <input type="number" id="edit-amt" placeholder="Enter amount"
      min="0" max="${maxAllowed}" value="${oldAmt > 0 ? oldAmt : 1}">
    <div class="edit-max-hint">
      <span>Max allowed:</span>
      <strong>${fmtRs(maxAllowed)}</strong>
    </div>
    <label>Payment Mode</label>
    <select id="edit-mode">
      <option value="upi">📲 UPI (Online)</option>
      <option value="cash">💵 Cash</option>
    </select>
    <div class="modal-actions">
      <button class="btn-modal btn-modal-cancel" id="m-cancel">Cancel</button>
      <button class="btn-modal btn-modal-ok"     id="m-ok">✓ Update</button>
    </div>`, resetAdmin);

  const amtInput  = m.querySelector("#edit-amt");
  const modeInput = m.querySelector("#edit-mode");
  modeInput.value = receipt.mode || "upi";
  amtInput.focus();

  m.querySelector("#m-cancel").onclick = () => { resetAdmin(); closeAllOverlays(); };

  const okBtn = m.querySelector("#m-ok");
  okBtn.onclick = async () => {
    const raw = amtInput.value.trim();
    if (!raw)              { toast("Please enter an amount."); return; }
    const val = parseFloat(raw);
    if (isNaN(val))        { toast("Invalid amount. Enter a number."); return; }
    if (val <= 0)          { toast("Amount must be greater than 0."); return; }
    if (val > maxAllowed)  { toast(`Cannot exceed max allowed: ${fmtRs(maxAllowed)}`); return; }
    if (val === oldAmt && modeInput.value === (receipt.mode || "upi")) {
      toast("No change — amount and mode are the same.");
      return;
    }
    okBtn.disabled = true;
    const newMode = modeInput.value;
    closeAllOverlays();
    await applyEdit(receipt, val, newMode);
  };
}

async function applyEdit(oldReceipt, newAmount, newMode = "upi") {
  if (!isAdminMode) { toast("Unauthorized access."); return; }
  if (!adminUser) { toast("Admin login required."); isAdminMode = false; return; }
  enforceDefaults();

  const feeRef = getFeeItemByReceipt(oldReceipt);
  if (!feeRef) { toast("Fee item not found — edit aborted."); isAdminMode = false; return; }

  const { item } = feeRef;
  const oldAmt   = safe(oldReceipt.amount);
  const total    = safe(item.total);

  const prevItemPaid         = safe(item.paid);
  const prevReceiptsSnapshot = (SD.receipts || []).map(r => ({ ...r }));

  try {
    item.paid = Math.max(0, Math.min(total, safe(item.paid) - oldAmt + newAmount));
    oldReceipt.status = "cancelled";

    const newCode    = receiptCode(SD.name, SD.class, oldReceipt.subType, newAmount);
    const newReceipt = {
      code:    newCode,
      amount:  newAmount,
      type:    oldReceipt.type,
      subType: oldReceipt.subType,
      date:    today(),
      status:  "active",
      mode:    newMode
    };

    if (!Array.isArray(SD.receipts)) SD.receipts = [];
    SD.receipts.push(newReceipt);
    if (SD.receipts.length > MAX_RECEIPTS) {
      SD.receipts = SD.receipts.slice(-MAX_RECEIPTS);
    }

    await saveAll();

    render();
    await showSuccess(oldReceipt.subType, newAmount, newCode);

  } catch (err) {
    item.paid   = prevItemPaid;
    SD.receipts = prevReceiptsSnapshot;
    toast("Error saving edit: " + err.message);
    console.error("applyEdit error:", err);
    render();

  } finally {
    isAdminMode = false;
  }
}

/* ═══════════════════════════════════════════

═══════════════════════════════════════════ */
function closeAllOverlays() {
  document.querySelectorAll(".overlay").forEach(o => o.remove());
}

function overlay(html, onDismiss) {
  closeAllOverlays();
  const ov = document.createElement("div");
  ov.className = "overlay";
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = html;
  ov.appendChild(m);
  document.body.appendChild(ov);

  const dismiss = () => {
    if (typeof onDismiss === "function") onDismiss();
    closeAllOverlays();
  };

  ov.addEventListener("click", e => { if (e.target === ov) dismiss(); });

  const cl = m.querySelector(".modal-close");
  if (cl) cl.onclick = dismiss;

  return m;
}

  m.querySelector("#m-ok").onclick = () => {
    const feeType = m.querySelector("#fee-type-sel").value;
    closeAllOverlays();

    if      (feeType === "term")             adminTermFlow();
    else if (feeType === "bus")              adminMonthlyFlow("bus", "Bus Fee");
    else if (feeType === "eca")              adminActionFlow("eca", null, "ECA Fee");
    else if (feeType === "annual")           adminActionFlow("annual", null, "Annual Day Fee");
    else if (feeType === "other")            adminOtherFlow();
    else if (feeType === "previous_tuition") adminActionFlow("previous_tuition", null, "Previous Year Tuition Arrear");
    else if (feeType === "previous_bus")     adminActionFlow("previous_bus", null, "Previous Year Bus Arrear");
  };
}

function adminTermFlow() {
  const opts = TERMS.map((t, i) => `<option value="${i}">${htmlEscape(t.name)}</option>`).join("");
  const m = overlay(`
    <button class="modal-close">✕</button>
    <h3>Select Term</h3>
    <label>Term</label>
    <select id="term-sel">${opts}</select>
    <div class="modal-actions">
      <button class="btn-modal btn-modal-cancel" id="m-cancel">Cancel</button>
      <button class="btn-modal btn-modal-ok"     id="m-ok">Next</button>
    </div>`);

  m.querySelector("#m-cancel").onclick = closeAllOverlays;
  m.querySelector("#m-ok").onclick = () => {
    const idx = m.querySelector("#term-sel").value;
    closeAllOverlays();
    adminActionFlow("term", idx, TERMS[parseInt(idx)]?.name || "Term");
  };
}

function adminMonthlyFlow(feeType, feeLabel) {
  const availMonths = feeType === "bus"
    ? MONTH_ORDER.filter(m => SD.busFee && SD.busFee.monthly[m])
    : MONTH_ORDER;
  const opts = availMonths.map(m => `<option value="${m}">${capF(m)}</option>`).join("");

  const modal = overlay(`
    <button class="modal-close">✕</button>
    <h3>Select Month</h3>
    <label>Month</label>
    <select id="month-sel">${opts}</select>
    <div class="modal-actions">
      <button class="btn-modal btn-modal-cancel" id="m-cancel">Cancel</button>
      <button class="btn-modal btn-modal-ok"     id="m-ok">Next</button>
    </div>`);

  modal.querySelector("#m-cancel").onclick = closeAllOverlays;
  modal.querySelector("#m-ok").onclick = () => {
    const month = modal.querySelector("#month-sel").value;
    closeAllOverlays();
    adminActionFlow(feeType, month, `${feeLabel} – ${capF(month)}`);
  };
}

function adminOtherFlow() {
  const opts = SD.otherFees.map((f, i) => `<option value="${i}">${htmlEscape(f.name)}</option>`).join("");
  const m = overlay(`
    <button class="modal-close">✕</button>
    <h3>Select Fee</h3>
    <label>Fee</label>
    <select id="other-sel">${opts}</select>
    <div class="modal-actions">
      <button class="btn-modal btn-modal-cancel" id="m-cancel">Cancel</button>
      <button class="btn-modal btn-modal-ok"     id="m-ok">Next</button>
    </div>`);

  m.querySelector("#m-cancel").onclick = closeAllOverlays;
  m.querySelector("#m-ok").onclick = () => {
    const idx = parseInt(m.querySelector("#other-sel").value);
    const fee = SD.otherFees[idx];
    closeAllOverlays();
    if (!fee) return;

    if (fee.type === "monthly") {
      const months = MONTH_ORDER.filter(mo => fee.monthly && fee.monthly[mo]);
      const mopts  = months.map(mo => `<option value="${mo}">${capF(mo)}</option>`).join("");
      const m2 = overlay(`
        <button class="modal-close">✕</button>
        <h3>Select Month</h3>
        <label>Month</label>
        <select id="month-sel">${mopts}</select>
        <div class="modal-actions">
          <button class="btn-modal btn-modal-cancel" id="m-cancel">Cancel</button>
          <button class="btn-modal btn-modal-ok"     id="m-ok">Next</button>
        </div>`);
      m2.querySelector("#m-cancel").onclick = closeAllOverlays;
      m2.querySelector("#m-ok").onclick = () => {
        const month = m2.querySelector("#month-sel").value;
        closeAllOverlays();
        adminActionFlow("other", `${idx}:${month}`, `${fee.name} – ${capF(month)}`);
      };
    } else {
      adminActionFlow("other", String(idx), fee.name);
    }
  };
}

function adminActionFlow(feeType, identifier, label) {
  const m = overlay(`
    <button class="modal-close">✕</button>
    <h3>Update: ${htmlEscape(label)}</h3>
    <label>Action</label>
    <select id="action-sel">
      <option value="full">Full Payment</option>
      <option value="partial">Partial Payment</option>
    </select>
    <label>Payment Mode</label>
    <select id="mode-sel">
      <option value="upi">📲 UPI (Online)</option>
      <option value="cash">💵 Cash</option>
    </select>
    <div id="amt-row" style="display:none;margin-top:0.6rem">
      <label>Amount (₹) — use negative to reduce</label>
      <input type="number" id="amt-inp" placeholder="e.g. 500 or -200">
    </div>
    <div class="modal-actions">
      <button class="btn-modal btn-modal-cancel" id="m-cancel">Cancel</button>
      <button class="btn-modal btn-modal-ok"     id="m-ok">Confirm</button>
    </div>`);

  const sel    = m.querySelector("#action-sel");
  const amtRow = m.querySelector("#amt-row");
  const amtInp = m.querySelector("#amt-inp");
  const okBtn  = m.querySelector("#m-ok");

  sel.onchange = () => {
    amtRow.style.display = sel.value === "partial" ? "block" : "none";
  };

  m.querySelector("#m-cancel").onclick = closeAllOverlays;

  okBtn.onclick = async () => {
    const action = sel.value;
    const mode   = m.querySelector("#mode-sel").value;

    if (action === "full") {
      okBtn.disabled = true;
      closeAllOverlays();
      await applyPayment(feeType, identifier, 0, true, mode);
      return;
    }

    const rawVal = amtInp.value.trim();
    if (!rawVal)         { toast("Please enter an amount."); return; }
    const amount = parseFloat(rawVal);
    if (isNaN(amount))   { toast("Invalid amount. Please enter a number."); return; }
    if (amount === 0)    { toast("Amount must be non-zero."); return; }

    okBtn.disabled = true;
    closeAllOverlays();
    await applyPayment(feeType, identifier, amount, false, mode);
  };
}

/* ═══════════════════════════════════════════
   HELP POPUP

/* ═══════════════════════════════════════════
   TOAST
═══════════════════════════════════════════ */
function toast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2700);
}

/* ═══════════════════════════════════════════
   DARK MODE
═══════════════════════════════════════════ */
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
}

function detectSystemTheme() {
  applyTheme(window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}

window.matchMedia("(prefers-color-scheme: dark)")
  .addEventListener("change", e => { applyTheme(e.matches ? "dark" : "light"); });

/* ═══════════════════════════════════════════
   STEALTH KEYBOARD SHORTCUTS
═══════════════════════════════════════════ */
let keys      = { a: false, d: false, e: false };
let comboLock = false;

document.addEventListener("keydown", e => {
  const tag = e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

  const k = e.key.toLowerCase();
  if (k === "a") keys.a = true;
  if (k === "d") keys.d = true;
  if (k === "e") keys.e = true;

  if (comboLock) return;

  if (keys.a && keys.d) {
    comboLock = true;
    openAdminAuth("add");
  } else if (keys.e && keys.d) {
    comboLock = true;
    openAdminAuth("edit");
  }
});

document.addEventListener("keyup", e => {
  const k = e.key.toLowerCase();
  if (k === "a") keys.a = false;
  if (k === "d") keys.d = false;
  if (k === "e") keys.e = false;
  comboLock = false;
});

window.addEventListener("blur", () => {
  keys.a = keys.d = keys.e = false;
  comboLock = false;
});

/* ═══════════════════════════════════════════
   UNIFIED ADMIN AUTH MODAL (Firebase) – PASSWORD ONLY
═══════════════════════════════════════════ */
function openAdminAuth(mode) {
  if (adminUser) {
    if (mode === "add") {
      adminSelectFeeType();
    } else {
      isAdminMode = true;
      openAdminEditSelector();
    }
    return;
  }

  const m = overlay(`
    <button class="modal-close">✕</button>
    <h3>🔐 Admin Login</h3>
    <label>Password</label>
    <input type="password" id="admin-pass" placeholder="Enter password" autocomplete="current-password">
    <div class="modal-actions">
      <button class="btn-modal btn-modal-cancel" id="m-cancel">Cancel</button>
      <button class="btn-modal btn-modal-ok"     id="m-ok">Login</button>
    </div>`);

  const passInput = m.querySelector("#admin-pass");
  const okBtn     = m.querySelector("#m-ok");
  passInput.focus();

  const attempt = async () => {
    const password = passInput.value;
    if (!password) {
      toast("Please enter password.");
      return;
    }
    okBtn.disabled = true;
    try {
      await signInWithEmailAndPassword(auth, ADMIN_EMAIL_1, password);
    } catch (err1) {
      try {
        await signInWithEmailAndPassword(auth, ADMIN_EMAIL_2, password);
      } catch (err2) {
        toast("Wrong password");
        okBtn.disabled = false;
        passInput.value = "";
        passInput.focus();
        return;
      }
    }
    closeAllOverlays();
    if (mode === "add") {
      adminSelectFeeType();
    } else {
      isAdminMode = true;
      openAdminEditSelector();
    }
  };

  m.querySelector("#m-cancel").onclick = closeAllOverlays;
  okBtn.onclick = attempt;
  passInput.addEventListener("keydown", e => {
    if (e.key === "Enter") attempt();
  });
}

/* ═══════════════════════════════════════════
   ADMIN EDIT SELECTOR
═══════════════════════════════════════════ */
function openAdminEditSelector() {
  const receipts = (SD.receipts || [])
    .filter(r => !r.status || r.status === "active")
    .slice()
    .reverse();

  if (!receipts.length) {
    toast("No active records to edit.");
    isAdminMode = false;
    return;
  }

  const options = receipts.map(r => {
    const safeCode = htmlEscape(r.code || "");
    const safeText = `${htmlEscape(r.subType || "—")} — ${fmtRs(r.amount)} (${htmlEscape(r.date || "—")})`;
    return `<option value="${safeCode}">${safeText}</option>`;
  }).join("");

  const resetAdmin = () => { isAdminMode = false; };

  const m = overlay(`
    <button class="modal-close">✕</button>
    <h3>✏ Select Payment to Edit</h3>
    <label>Payment Record</label>
    <select id="edit-select">${options}</select>
    <div class="modal-actions" style="justify-content:space-between">
      <button class="btn-modal btn-modal-cancel" style="background:transparent;color:var(--red);border:1px solid var(--red);padding:0.4rem 0.9rem;" id="m-signout">🚪 Sign Out</button>
      <div style="display:flex;gap:0.5rem">
        <button class="btn-modal btn-modal-cancel" id="m-cancel">Cancel</button>
        <button class="btn-modal btn-modal-ok"     id="m-ok">Edit</button>
      </div>
    </div>`, resetAdmin);

  m.querySelector("#m-cancel").onclick = () => { resetAdmin(); closeAllOverlays(); };

  m.querySelector("#m-signout").onclick = async () => {
    closeAllOverlays();
    isAdminMode = false;
    await signOut(auth);
    toast("Signed out.");
  };

  m.querySelector("#m-ok").onclick = () => {
    const code = m.querySelector("#edit-select").value;
    closeAllOverlays();
    editPayment(code);
  };
}

/* ═══════════════════════════════════════════
   VIEW TABS
═══════════════════════════════════════════ */
function setView(v) {
  VIEW = v;
  el("tabTerm").classList.toggle("active",    v === "term");
  el("tabOther").classList.toggle("active",   v === "other");
  el("tabHistory").classList.toggle("active", v === "history");
  render();
}

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
window.addEventListener("DOMContentLoaded", () => {
  detectSystemTheme();

  el("logoutBtn").onclick = async () => {
    if (adminUser) {
      await signOut(auth);
    }
    location.href = "../index.html";
  };

  el("tabTerm").onclick    = () => setView("term");
  el("tabOther").onclick   = () => setView("other");
  el("tabHistory").onclick = () => setView("history");
  el("payBtn").onclick     = openPay;
  el("helpBtn").onclick    = openHelp;

  loadStudent();

  let longPressTimer = null;
  const nameEl = el("studentName");

  nameEl.addEventListener("touchstart", () => {
    longPressTimer = setTimeout(() => {
      longPressTimer = null;
      openAdminAuth("add");
    }, 1300);
  }, { passive: true });

  const cancelLongPress = () => {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  };
  nameEl.addEventListener("touchend",    cancelLongPress, { passive: true });
  nameEl.addEventListener("touchmove",   cancelLongPress, { passive: true });
  nameEl.addEventListener("touchcancel", cancelLongPress, { passive: true });
});
</script>

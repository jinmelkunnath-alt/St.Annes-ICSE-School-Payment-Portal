<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>St. Anne's ICSE | Fee Portal</title>
<style>
/* ═══════════════════════════════════════════
   RESET + BASE
═══════════════════════════════════════════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --brand:       #1e4a76;
  --brand-dark:  #0f3259;
  --brand-light: #3b82f6;
  --brand-pale:  #eef4ff;
  --bg:          #f0f4fa;
  --surface:     #ffffff;
  --border:      #e2e9f4;
  --text:        #0f2236;
  --muted:       #5a7080;
  --green:       #1a7a45;
  --green-bg:    #e0f7ec;
  --red:         #c0392b;
  --red-bg:      #fdecea;
  --radius-lg:   20px;
  --radius-md:   14px;
  --radius-sm:   10px;
  --shadow-sm:   0 1px 4px rgba(0,0,0,0.06);
  --shadow-md:   0 4px 16px rgba(0,0,0,0.08);
  --shadow-lg:   0 12px 40px rgba(0,0,0,0.12);
  --transition:  0.3s cubic-bezier(0.4,0,0.2,1);
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ═══════════════════════════════════════════
   APP SHELL
═══════════════════════════════════════════ */
#app { display: none; max-width: 900px; margin: 0 auto; padding: 0 1rem 3rem; }
#app.visible { display: block; }

/* ═══════════════════════════════════════════
   HEADER
═══════════════════════════════════════════ */
.app-header {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  padding: 0.85rem 1.25rem;
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem;
  box-shadow: var(--shadow-sm);
  margin: 0 -1rem 1.5rem;
}
.brand-name {
  font-size: 1rem; font-weight: 700;
  color: var(--brand);
  letter-spacing: -0.02em;
  position: relative;
}
.brand-name::after {
  content: '';
  position: absolute; bottom: -3px; left: 0;
  width: 36px; height: 2.5px;
  background: linear-gradient(90deg, var(--brand), var(--brand-light));
  border-radius: 2px;
}
.btn-logout {
  background: var(--brand-pale); color: var(--brand);
  border: 1px solid #c7d9f5;
  padding: 0.45rem 1rem; border-radius: 2rem;
  font-size: 0.8rem; font-weight: 600;
  cursor: pointer; transition: var(--transition);
  font-family: inherit;
}
.btn-logout:hover { background: #dce9fb; }

/* ═══════════════════════════════════════════
   STUDENT CARD
═══════════════════════════════════════════ */
.student-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 1.4rem 1.5rem;
  margin-bottom: 1.25rem;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  border-left: 4px solid var(--brand-light);
  display: flex; flex-wrap: wrap;
  justify-content: space-between; align-items: center;
  gap: 1.2rem;
}
.student-name {
  font-size: 1.45rem; font-weight: 700;
  color: var(--brand); letter-spacing: -0.03em;
  cursor: default;
  user-select: none;
  -webkit-user-select: none;
}
.student-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.4rem; }
.tag {
  background: var(--brand-pale); color: var(--brand);
  padding: 0.25rem 0.85rem; border-radius: 2rem;
  font-size: 0.75rem; font-weight: 600;
}

/* ── Progress ── */
.progress-block { min-width: 180px; flex: 1; }
.progress-label {
  font-size: 0.68rem; font-weight: 700;
  color: var(--muted); letter-spacing: 0.06em;
  text-transform: uppercase; margin-bottom: 6px;
}
.progress-track {
  background: var(--border); border-radius: 40px;
  height: 8px; width: 100%; overflow: hidden;
}
.progress-bar {
  display: block; height: 100%;
  background: linear-gradient(90deg, var(--brand), var(--brand-light));
  border-radius: 40px; width: 0%;
  transition: width 0.7s cubic-bezier(0.4,0,0.2,1);
}
.progress-pct {
  font-size: 0.72rem; font-weight: 700;
  color: var(--brand); text-align: right; margin-top: 4px;
}

/* ═══════════════════════════════════════════
   VIEW TABS
═══════════════════════════════════════════ */
.view-tabs {
  display: flex; gap: 0.5rem;
  background: var(--surface);
  border-radius: 2rem; padding: 4px;
  border: 1px solid var(--border);
  width: fit-content;
  margin-bottom: 1.25rem;
  box-shadow: var(--shadow-sm);
}
.view-tab {
  border: none; background: transparent;
  padding: 0.5rem 1.3rem; border-radius: 2rem;
  font-size: 0.83rem; font-weight: 600;
  cursor: pointer; transition: var(--transition);
  font-family: inherit; color: var(--muted);
}
.view-tab.active {
  background: var(--brand); color: #fff;
  box-shadow: 0 2px 8px rgba(30,74,118,0.3);
}

/* ═══════════════════════════════════════════
   CONTENT AREA
═══════════════════════════════════════════ */
#content { min-height: 200px; }

/* ═══════════════════════════════════════════
   TERM TABLE (static wrap)
═══════════════════════════════════════════ */
.term-table-wrap {
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.fee-table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.fee-table {
  width: 100%; border-collapse: collapse;
  font-size: 0.84rem; min-width: 500px;
}
.fee-table thead th {
  background: #f6f9fd; color: var(--muted);
  font-size: 0.72rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.05em;
  padding: 0.85rem 1rem; text-align: left;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.fee-table tbody td {
  padding: 0.9rem 1rem;
  border-bottom: 1px solid #f3f6fb;
  color: var(--text); font-weight: 500;
}
.fee-table tbody tr:last-child td { border-bottom: none; }
.fee-table tbody tr:hover td { background: #fafcff; }

.badge {
  display: inline-block;
  padding: 0.22rem 0.8rem; border-radius: 2rem;
  font-size: 0.68rem; font-weight: 700; white-space: nowrap;
}
.badge-paid    { background: var(--green-bg); color: var(--green); }
.badge-pending { background: var(--red-bg);   color: var(--red);   }

/* ═══════════════════════════════════════════
   EXPANDABLE SECTIONS (OTHER FEES)
═══════════════════════════════════════════ */
.sections-list { display: flex; flex-direction: column; gap: 0.65rem; }

.exp-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  transition: box-shadow var(--transition);
}
.exp-card:hover { box-shadow: var(--shadow-md); }

.exp-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1rem 1.2rem;
  cursor: pointer;
  background: #f8fafd;
  border-bottom: 1px solid transparent;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  transition: background var(--transition), border-color var(--transition);
  user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.exp-header:hover  { background: #f2f6fc; }
.exp-header:active { transform: scale(0.995); }
.exp-header.open   { background: #eaf1fb; border-bottom-color: var(--border); }

.exp-header-left { display: flex; align-items: center; gap: 0.7rem; }
.exp-icon { font-size: 1.1rem; line-height: 1; }
.exp-title { font-size: 0.92rem; font-weight: 700; color: var(--brand); }
.exp-subtitle { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }

.exp-header-right { display: flex; align-items: center; gap: 0.75rem; }
.exp-summary { font-size: 0.78rem; font-weight: 600; color: var(--muted); }
.exp-arrow {
  width: 22px; height: 22px;
  background: var(--brand-pale); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.55rem; color: var(--brand);
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1),
              background var(--transition);
  flex-shrink: 0;
}
.exp-arrow.open { transform: rotate(90deg); background: var(--brand); color: #fff; }

.exp-body {
  max-height: 0;
  overflow: hidden;
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  transition: max-height 0.42s cubic-bezier(0.4,0,0.2,1);
  transform: translateZ(0);               /* GPU layer promotion */
}

.exp-body-inner {
  padding: 0.5rem 0.75rem 0.75rem;
}

.exp-body-inner .fee-table-scroll {
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-x;
  width: 100%;
  border-radius: var(--radius-sm);
}

/* ═══════════════════════════════════════════
   SUMMARY BAR
═══════════════════════════════════════════ */
.summary-bar {
  display: flex; flex-wrap: wrap; gap: 1rem;
  background: var(--surface); border-radius: var(--radius-lg);
  border: 1px solid var(--border); border-top: 3px solid var(--brand-light);
  padding: 1rem 1.4rem;
  margin-top: 1.25rem;
  box-shadow: var(--shadow-sm);
}
.summary-item { display: flex; flex-direction: column; gap: 2px; }
.summary-label { font-size: 0.68rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.summary-value { font-size: 1.05rem; font-weight: 700; color: var(--brand); }
.summary-value.green { color: var(--green); }
.summary-value.red   { color: var(--red); }

/* ═══════════════════════════════════════════
   ACTION ROW
═══════════════════════════════════════════ */
.action-row {
  display: flex; gap: 0.75rem; flex-wrap: wrap;
  margin-top: 1.25rem;
}
.btn-action {
  border: none; border-radius: 2rem;
  padding: 0.6rem 1.4rem;
  font-size: 0.84rem; font-weight: 600;
  cursor: pointer; transition: var(--transition);
  font-family: inherit; display: flex; align-items: center; gap: 0.4rem;
}
.btn-pay  { background: var(--brand); color: #fff; box-shadow: 0 3px 10px rgba(30,74,118,0.25); }
.btn-pay:hover  { background: var(--brand-dark); transform: translateY(-1px); }
.btn-pay:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-help { background: var(--brand-pale); color: var(--brand); border: 1px solid #c7d9f5; }
.btn-help:hover { background: #dce9fb; }

.info-note {
  font-size: 0.76rem; color: var(--muted);
  background: var(--brand-pale); border-left: 3px solid var(--brand-light);
  padding: 0.55rem 1rem; border-radius: var(--radius-sm);
  margin-top: 0.75rem; display: inline-block;
}

/* ═══════════════════════════════════════════
   MODAL / POPUP OVERLAY
═══════════════════════════════════════════ */
.overlay {
  position: fixed; inset: 0;
  background: rgba(10,20,40,0.45);
  backdrop-filter: blur(6px);
  z-index: 8000;
  display: flex; align-items: center; justify-content: center;
  padding: 1rem;
  opacity: 0; animation: fadeIn 0.22s ease forwards;
}
@keyframes fadeIn { to { opacity: 1; } }

.modal {
  background: var(--surface); border-radius: var(--radius-lg);
  width: 100%; max-width: 340px;
  padding: 1.5rem; position: relative;
  box-shadow: var(--shadow-lg);
  transform: scale(0.93); opacity: 0;
  animation: popIn 0.22s ease forwards;
}
@keyframes popIn { to { transform: scale(1); opacity: 1; } }

.modal-close {
  position: absolute; top: 14px; right: 16px;
  background: none; border: none; font-size: 1.1rem;
  cursor: pointer; color: var(--muted); line-height: 1;
  transition: color var(--transition);
}
.modal-close:hover { color: var(--red); }

.modal h3 {
  font-size: 1.1rem; font-weight: 700; color: var(--brand);
  border-left: 3px solid var(--brand-light); padding-left: 0.7rem;
  margin-bottom: 1rem;
}

/* forms inside modals */
.modal label {
  font-size: 0.75rem; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.04em;
  display: block; margin-top: 0.9rem; margin-bottom: 0.3rem;
}
.modal input, .modal select {
  width: 100%; padding: 0.75rem 1rem;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  font-size: 0.88rem; font-family: inherit;
  background: #fafbfd; color: var(--text);
  transition: border-color var(--transition), box-shadow var(--transition);
  outline: none;
}
.modal input:focus, .modal select:focus {
  border-color: var(--brand-light);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
  background: var(--surface);
}
.modal-actions {
  display: flex; gap: 0.6rem; justify-content: flex-end; margin-top: 1.2rem;
}
.btn-modal {
  border: none; border-radius: 2rem;
  padding: 0.55rem 1.2rem;
  font-size: 0.83rem; font-weight: 600;
  cursor: pointer; transition: var(--transition); font-family: inherit;
}
.btn-modal-cancel { background: #f0f3f8; color: var(--muted); }
.btn-modal-cancel:hover { background: #e5e9f0; }
.btn-modal-ok { background: var(--brand); color: #fff; }
.btn-modal-ok:hover { background: var(--brand-dark); transform: translateY(-1px); }
.btn-modal-ok:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

/* ── QR / Pay popup (old) ── */
.qr-wrap { text-align: center; }
.qr-wrap img {
  width: 120px; height: 120px;
  border-radius: var(--radius-md);
  margin: 0.5rem auto; display: block;
  box-shadow: var(--shadow-sm);
}
.upi-row {
  display: flex; align-items: center; gap: 0.5rem;
  background: #f4f7fc; border: 1px solid var(--border);
  border-radius: 2rem; padding: 0.5rem 0.9rem; margin: 0.8rem 0;
}
.upi-text { font-family: monospace; font-size: 0.82rem; color: var(--brand); flex: 1; }
.btn-copy {
  background: var(--brand-pale); border: none;
  border-radius: 2rem; padding: 0.3rem 0.75rem;
  font-size: 0.73rem; font-weight: 600; color: var(--brand);
  cursor: pointer; flex-shrink: 0; font-family: inherit;
  transition: var(--transition);
}
.btn-copy:hover { background: #dce9fb; }
.btn-upi-pay {
  width: 100%; background: var(--brand); color: #fff;
  border: none; border-radius: 2rem; padding: 0.72rem;
  font-size: 0.88rem; font-weight: 700; cursor: pointer;
  margin: 0.4rem 0; font-family: inherit; transition: var(--transition);
}
.btn-upi-pay:hover { background: var(--brand-dark); transform: translateY(-1px); }
.wa-note { font-size: 0.74rem; color: var(--muted); text-align: center; margin-top: 0.6rem; }
.wa-link { color: #25D366; font-weight: 700; cursor: pointer; text-decoration: underline; }
.btn-wa {
  width: 100%; background: #25D366; color: #fff;
  border: none; border-radius: 2rem; padding: 0.72rem;
  font-size: 0.88rem; font-weight: 700; cursor: pointer;
  font-family: inherit; transition: var(--transition); margin-top: 0.4rem;
}
.btn-wa:hover { background: #1aad55; transform: translateY(-1px); }

/* ═══════════════════════════════════════════
   PAYMENT POPUP CARDS (new multi-account)
═══════════════════════════════════════════ */
.payment-popup {
  max-width: 400px;
  width: 100%;
}

.payment-popup .modal {
  max-width: 400px;  /* slightly wider for three cards */
  padding: 1.5rem 1.2rem;
}

.payment-popup h3 {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--brand);
  margin-bottom: 0.25rem;
}

.payment-popup .subtitle {
  font-size: 0.78rem;
  color: var(--muted);
  margin-bottom: 1.2rem;
}

.payment-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  margin-bottom: 0.75rem;
  transition: box-shadow 0.2s ease, transform 0.2s ease;
  overflow: hidden;
  transform: translateZ(0);
}

.payment-card:active {
  transform: scale(0.99);
}

.payment-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.9rem 1rem;
  cursor: pointer;
  background: #f8fafd;
  border-bottom: 1px solid transparent;
  transition: background 0.2s, border-color 0.2s;
  user-select: none;
  -webkit-user-select: none;
}

.payment-card-header:hover {
  background: #f2f6fc;
}

.payment-card-header.open {
  background: #eaf1fb;
  border-bottom-color: var(--border);
}

.payment-card-icon {
  font-size: 1.8rem;
  width: 2.4rem;
  text-align: center;
  flex-shrink: 0;
}

.payment-card-info {
  flex: 1;
  margin-left: 0.8rem;
}

.payment-card-name {
  font-weight: 700;
  font-size: 0.92rem;
  color: var(--brand);
}

.payment-card-upi {
  font-size: 0.7rem;
  font-family: monospace;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}

.payment-card-chevron {
  width: 22px;
  height: 22px;
  background: var(--brand-pale);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.55rem;
  color: var(--brand);
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1), background 0.3s;
  flex-shrink: 0;
}

.payment-card-header.open .payment-card-chevron {
  transform: rotate(90deg);
  background: var(--brand);
  color: #fff;
}

.payment-card-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.45s cubic-bezier(0.4,0,0.2,1);
  transform: translateZ(0);
}

.payment-card-body-inner {
  padding: 0.8rem 1rem;
  text-align: center;
}

.payment-card-body img {
  width: 100px;
  height: 100px;
  border-radius: var(--radius-md);
  margin: 0.5rem auto;
  display: block;
  box-shadow: var(--shadow-sm);
}

.payment-card-body .upi-row {
  margin: 0.6rem 0;
}

.payment-card-body .btn-upi-pay {
  width: 100%;
  margin: 0.4rem 0;
}

/* ═══════════════════════════════════════════
   RECEIPT SUCCESS (unchanged)
═══════════════════════════════════════════ */
.receipt-wrap { text-align: center; }
.receipt-wrap img {
  width: 100%; border-radius: var(--radius-md);
  margin: 0.6rem 0; box-shadow: var(--shadow-sm);
}
.receipt-code {
  font-family: monospace; font-size: 0.82rem;
  background: #f4f7fc; border-radius: var(--radius-sm);
  padding: 0.5rem; margin: 0.5rem 0; color: var(--brand); font-weight: 700;
}
.receipt-btns { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
.receipt-btns .btn-action { flex: 1; justify-content: center; font-size: 0.8rem; }

/* ── SVG tick ── */
.tick-wrap { display: flex; justify-content: center; margin: 0.5rem 0 0.8rem; }
.tick-svg { width: 60px; height: 60px; }
.tick-circle {
  stroke: #22c55e; stroke-width: 3; fill: none;
  stroke-dasharray: 166; stroke-dashoffset: 166;
  animation: circleDraw 0.55s ease-out forwards;
}
.tick-path {
  stroke: #22c55e; stroke-width: 4; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 48; stroke-dashoffset: 48;
  animation: tickDraw 0.35s ease-out 0.55s forwards;
}
@keyframes circleDraw { to { stroke-dashoffset: 0; } }
@keyframes tickDraw   { to { stroke-dashoffset: 0; } }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%);
  background: #1e2d3d; color: #fff;
  padding: 0.6rem 1.4rem; border-radius: 2rem;
  font-size: 0.82rem; font-weight: 500;
  z-index: 9500; box-shadow: var(--shadow-lg);
  animation: toastAnim 2.6s forwards;
  white-space: nowrap;
}
@keyframes toastAnim {
  0%   { opacity: 0; transform: translateX(-50%) translateY(8px); }
  12%  { opacity: 1; transform: translateX(-50%) translateY(0); }
  80%  { opacity: 1; }
  100% { opacity: 0; }
}

/* ═══════════════════════════════════════════
   RECEIPT TEMPLATE (off-screen render)
═══════════════════════════════════════════ */
#receipt-tpl {
  position: absolute; left: -9999px; top: 0;
  width: 360px; background: #fff; padding: 24px;
  border-radius: 24px; font-family: -apple-system, sans-serif;
  box-shadow: none;
}
.rt-header { text-align: center; margin-bottom: 18px; }
.rt-header h2 { color: var(--brand); font-size: 18px; margin-bottom: 2px; }
.rt-header p  { font-size: 11px; color: var(--muted); }
.rt-student {
  display: flex; justify-content: space-between;
  background: #f4f8ff; padding: 11px 14px;
  border-radius: 12px; margin-bottom: 16px;
}
.rt-student .lbl { font-size: 10px; color: var(--muted); }
.rt-student .val { font-weight: 700; font-size: 13px; }
.rt-amount {
  text-align: center; padding: 16px;
  background: linear-gradient(135deg, var(--brand), var(--brand-light));
  border-radius: 14px; margin-bottom: 14px;
  box-shadow: 0 8px 20px rgba(30,74,118,0.2);
}

<script type="module">
import { initializeApp }                        from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  enableIndexedDbPersistence
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

/* ═══════════════════════════════════════════
   FIREBASE
═══════════════════════════════════════════ */
const fbApp = initializeApp({
  apiKey:            "AIzaSyArC1RsGTkS0cr5glTfgUdTktjcfj_Ad88",
  authDomain:        "fee-payment-portal.firebaseapp.com",
  projectId:         "fee-payment-portal",
  storageBucket:     "fee-payment-portal.firebasestorage.app",
  messagingSenderId: "1036013822615",
  appId:             "1:1036013822615:web:6c4159f84bae9882963fd2"
});

const db = getFirestore(fbApp);
const auth = getAuth(fbApp);
let adminUser = null;

onAuthStateChanged(auth, (user) => {
  adminUser = user || null;
});

enableIndexedDbPersistence(db).catch(err => {
  if (err.code === "failed-precondition") {
    console.warn("Offline persistence unavailable: multiple tabs open.");
    toast("Offline mode unavailable — multiple tabs detected.");
  } else if (err.code === "unimplemented") {
    console.warn("Offline persistence not supported in this browser.");
  } else {
    console.warn("Offline persistence error:", err.code);
  }
});

/* ═══════════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════════ */
const ADMIN_EMAIL_1 = "immanuelmelbindj@gmail.com";
const ADMIN_EMAIL_2 = "SCHOOL_OFFICE_EMAIL@gmail.com"; // PLACEHOLDER – replace with actual school email
const UPI_ID       = "jinmelkunnath@oksbi";          // legacy – not used in new popup
const UPI_NAME     = "St.%20Annes%20ICSE";
const WHATSAPP_URL = "https://wa.me/917012808911";
const QR_URL       = "https://raw.githubusercontent.com/jinmelkunnath-alt/St.Annes-ICSE-School-Payment-Portal/refs/heads/main/QR_IMG_01.png";
const MAX_RECEIPTS = 100;

const MONTH_ORDER = ["june","july","august","september","october","november","december","january","february","march"];

const TERM_NAMES = [
  "Term 1 (June – August)",
  "Term 2 (September – November)",
  "Term 3 (December – February)"
];

const FEE_ICONS = {
  bus:       "🚌", transport: "🚌",
  eca:       "🎨", arts:      "🎨", art: "🎨",
  annual:    "🎭", day:       "🎭",
  sports:    "🥇", games:     "🥇",
  lab:       "🧪", science:   "🧪",
  computer:  "💻", it:        "💻",
  library:   "📚", book:      "📚",
  music:     "🎵", dance:     "💃",
  uniform:   "👕", tuition:   "📖",
  exam:      "📝", id:        "🪪",
  picnic:    "🌳", trip:      "🌳",
  default:   "📋"
};

function iconFor(name) {
  if (!name) return FEE_ICONS.default;
  const lower = name.toLowerCase();
  for (const [key, icon] of Object.entries(FEE_ICONS)) {
    if (key !== "default" && lower.includes(key)) return icon;
  }
  return FEE_ICONS.default;
}

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
const safe  = v => { const n = Number(v); return isNaN(n) ? 0 : n; };
const el    = id  => document.getElementById(id);
const capF  = s   => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const fmtRs = n   => "₹" + safe(n).toLocaleString("en-IN");
const today = ()  => new Date().toISOString().slice(0, 10);

function htmlEscape(str) {
  if (str == null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function orderedEntries(obj) {
  return MONTH_ORDER
    .map(m => [m, (obj || {})[m]])
    .filter(([, v]) => v !== undefined);
}

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
const studentId = (new URLSearchParams(location.search).get("id") || "").trim().toLowerCase();
let SD          = {};
let TERMS       = [];
let VIEW        = "term";
let isAdminMode = false;

/* ═══════════════════════════════════════════
   LOADER
═══════════════════════════════════════════ */
function hideLoader() {
  el("app").classList.add("visible");
}

/* ═══════════════════════════════════════════
   NORMALISATION
═══════════════════════════════════════════ */
function normalizeTerms(raw) {
  const arr = Array.isArray(raw) ? raw : [];
  if (!arr.length) return TERM_NAMES.map(name => ({ name, total: 0, paid: 0 }));
  return arr.map((t, i) => ({
    name:  TERM_NAMES[i] || `Term ${i + 1}`,
    total: safe(t.total ?? 0),
    paid:  safe(t.paid  ?? 0)
  }));
}

function normalizeBusFee(raw) {
  if (!raw || typeof raw !== "object") return null;
  const src = (raw.monthly && typeof raw.monthly === "object") ? raw.monthly : raw;
  const monthly = {};
  Object.keys(src).forEach(k => {
    const v = src[k];
    monthly[k] = typeof v === "object"
      ? { total: safe(v.total ?? 0), paid: safe(v.paid ?? 0) }
      : { total: safe(v), paid: 0 };
  });
  if (!Object.keys(monthly).length) return null;
  return { monthly };
}

function normalizeEcaFee(raw) {
  if (raw && raw.monthly && typeof raw.monthly === "object") {
    let total = 0, paid = 0;
    Object.values(raw.monthly).forEach(m => { total += safe(m.total ?? 0); paid += safe(m.paid ?? 0); });
    return { total, paid };
  }
  if (!raw || typeof raw !== "object") return { total: 1250, paid: 0 };
  return { total: safe(raw.total ?? 1250), paid: safe(raw.paid ?? 0) };
}

function normalizeAnnualFee(raw) {
  if (!raw || typeof raw !== "object") return null;
  const total = safe(raw.total ?? 0);
  if (!total) return null;
  return { total, paid: safe(raw.paid ?? 0) };
}

function normalizeOtherFees(raw) {
  if (!Array.isArray(raw)) return [];
  return raw
    .filter(f => f && f.name)
    .filter(f => f.name.toLowerCase() !== "eca")
    .map(f => {
      const type = (f.type || "one-time").toLowerCase();
      if (type === "monthly" && f.monthly && typeof f.monthly === "object") {
        const monthly = {};
        Object.keys(f.monthly).forEach(k => {
          const v = f.monthly[k];
          monthly[k] = typeof v === "object"
            ? { total: safe(v.total ?? 0), paid: safe(v.paid ?? 0) }
            : { total: safe(v), paid: 0 };
        });
        return { name: f.name, type: "monthly", monthly };
      }
      const total = safe(f.total ?? 0);
      if (!total) return null;
      return { name: f.name, type: "one-time", total, paid: safe(f.paid ?? 0) };
    })
    .filter(Boolean);
}

function normalizePreviousYearFees(raw) {
  if (!raw || typeof raw !== "object") return null;
  const out = {};
  ["tuition","bus"].forEach(k => {
    if (raw[k] && typeof raw[k] === "object") {
      out[k] = {
        total: safe(raw[k].total ?? 0),
        paid:  safe(raw[k].paid  ?? 0)
      };
    }
  });
  return Object.keys(out).length ? out : null;
}

function enforceDefaults() {
  if (!SD.terms)     SD.terms     = normalizeTerms([]);
  if (!SD.ecaFee)    SD.ecaFee    = { total: 1250, paid: 0 };
  if (!SD.otherFees) SD.otherFees = [];
  if (!SD.receipts)  SD.receipts  = [];
  if (SD.previousYearFees === undefined) SD.previousYearFees = null;
  if (!Array.isArray(TERMS)) TERMS = [];
}

/* ═══════════════════════════════════════════
   LOAD
═══════════════════════════════════════════ */
async function loadStudent() {
  if (!studentId) {
    alert("No student ID in URL.\nExample: ?id=john001");
    hideLoader();
    return;
  }
  try {
    const snap = await getDoc(doc(db, "students", studentId));
    if (!snap.exists()) {
      alert(`Student not found: "${studentId}"`);
      hideLoader();
      return;
    }
    const raw = snap.data();
    SD = {
      name:      raw.name  || "Unknown",
      class:     String(raw.class || "—").toUpperCase(),
      phone:     raw.phone || "",
      receipts:  Array.isArray(raw.receipts) ? raw.receipts : [],
      terms:     normalizeTerms(raw.terms),
      busFee:    normalizeBusFee(raw.busFee),
      ecaFee:    normalizeEcaFee(raw.ecaFee || raw.eca),
      annualFee: normalizeAnnualFee(raw.annualFee),
      otherFees: normalizeOtherFees(raw.otherFees)
    };
    SD.previousYearFees = normalizePreviousYearFees(raw.previousYearFees);
    enforceDefaults();
    TERMS = SD.terms;

    el("studentName").textContent = SD.name;
    el("studentTags").innerHTML   = `<span class="tag">📖 Class ${htmlEscape(SD.class)}</span>`;

    render();
    hideLoader();
  } catch (err) {
    console.error("🔥 Firestore load error:", err);
    alert("Error loading student: " + err.message);
    hideLoader();
  }
}

/* ═══════════════════════════════════════════
   TOTALS
═══════════════════════════════════════════ */
function calcTermTotals() {
  let total = 0, paid = 0;
  TERMS.forEach(t => { total += safe(t.total); paid += safe(t.paid); });
  return { total, paid, remaining: total - paid };
}

function calcOtherTotals() {
  let total = 0, paid = 0;
  if (SD.busFee) {
    Object.values(SD.busFee.monthly).forEach(m => { total += safe(m.total); paid += safe(m.paid); });
  }
  total += safe(SD.ecaFee.total); paid += safe(SD.ecaFee.paid);
  if (SD.annualFee) { total += safe(SD.annualFee.total); paid += safe(SD.annualFee.paid); }
  SD.otherFees.forEach(f => {
    if (f.type === "monthly") {
      Object.values(f.monthly).forEach(m => { total += safe(m.total); paid += safe(m.paid); });
    } else {
      total += safe(f.total); paid += safe(f.paid);
    }
  });
  return { total, paid, remaining: total - paid };
}

function calcPreviousYearTotals() {
  let total = 0, paid = 0;
  if (SD.previousYearFees) {
    if (SD.previousYearFees.tuition) { total += safe(SD.previousYearFees.tuition.total); paid += safe(SD.previousYearFees.tuition.paid); }
    if (SD.previousYearFees.bus)     { total += safe(SD.previousYearFees.bus.total);     paid += safe(SD.previousYearFees.bus.paid); }
  }
  return { total, paid, remaining: total - paid };
}

function getGrandTotals() {
  const t = calcTermTotals();
  const o = calcOtherTotals();
  const p = calcPreviousYearTotals();
  return {
    total:     t.total     + o.total     + p.total,
    paid:      t.paid      + o.paid      + p.paid,
    remaining: t.remaining + o.remaining + p.remaining
  };
}

/* ═══════════════════════════════════════════
   PROGRESS
═══════════════════════════════════════════ */
function updateProgress(total, paid) {
  const pct = safe(total) > 0 ? Math.min(100, (safe(paid) / safe(total)) * 100) : 0;
  el("progressBlock").style.display = "block";
  el("progressBar").style.width     = pct + "%";
  el("progressBar").style.minWidth  = pct > 0 ? "5px" : "0";
  el("progressPct").textContent     = Math.round(pct) + "%";
  el("progressLabel").textContent   = VIEW === "term" ? "TERM FEES PAID" : "OTHER FEES PAID";
}

/* ═══════════════════════════════════════════
   SUMMARY BAR
═══════════════════════════════════════════ */
function renderSummary(total, paid, remaining) {
  el("summaryBar").innerHTML = `
    <div class="summary-item">
      <span class="summary-label">Total</span>
      <span class="summary-value">${fmtRs(total)}</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">Paid</span>
      <span class="summary-value green">${fmtRs(paid)}</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">Remaining</span>
      <span class="summary-value ${remaining > 0 ? "red" : "green"}">${fmtRs(remaining)}</span>
    </div>`;
}

/* ═══════════════════════════════════════════
   FEE TABLE BUILDER
═══════════════════════════════════════════ */
function buildFeeTable(rows) {
  const trs = rows.map(r => {
    const rem    = safe(r.total) - safe(r.paid);
    const isPaid = rem <= 0;
    return `<tr>
      <td style="text-align:left">${htmlEscape(r.label)}</td>
      <td>${fmtRs(r.total)}</td>
      <td>${fmtRs(r.paid)}</td>
      <td>${fmtRs(rem)}</td>
      <td><span class="badge ${isPaid ? "badge-paid" : "badge-pending"}">${isPaid ? "Paid" : "Pending"}</span></td>
    </tr>`;
  }).join("");
  return `<div class="fee-table-scroll"><table class="fee-table">
    <thead><tr>
      <th style="text-align:left">Fee Item</th>
      <th>Total</th><th>Paid</th><th>Remaining</th><th>Status</th>
    </tr></thead>
    <tbody>${trs || `<tr><td colspan="5" style="text-align:center;padding:1.5rem;color:#8a9bb0">No data</td></tr>`}</tbody>
  </table></div>`;
}

/* ═══════════════════════════════════════════
   EXPANDABLE CARD BUILDER
═══════════════════════════════════════════ */
let openCard = null;

function buildExpCard({ id, icon, title, subtitle, rows }) {
  const card = document.createElement("div");
  card.className = "exp-card";

  card.innerHTML = `
    <div class="exp-header" id="hdr-${id}">
      <div class="exp-header-left">
        <span class="exp-icon">${icon}</span>
        <div>
          <div class="exp-title">${htmlEscape(title)}</div>
          ${subtitle ? `<div class="exp-subtitle">${htmlEscape(subtitle)}</div>` : ""}
        </div>
      </div>
      <div class="exp-header-right">
        <span class="exp-summary" id="sum-${id}"></span>
        <span class="exp-arrow" id="arr-${id}">▶</span>
      </div>
    </div>
    <div class="exp-body" id="body-${id}">
      <div class="exp-body-inner">${buildFeeTable(rows)}</div>
    </div>`;

  updateCardSummary(card, rows, id);

  const hdr  = card.querySelector(`#hdr-${id}`);
  const body = card.querySelector(`#body-${id}`);
  const arr  = card.querySelector(`#arr-${id}`);

  hdr.addEventListener("click", () => {
    const isOpen = arr.classList.contains("open");
    if (openCard && openCard !== card) {
      const ob = openCard.querySelector(".exp-body");
      const oa = openCard.querySelector(".exp-arrow");
      const oh = openCard.querySelector(".exp-header");
      if (ob) ob.style.maxHeight = "0";
      if (oa) oa.classList.remove("open");
      if (oh) oh.classList.remove("open");
    }
    if (isOpen) {
      body.style.maxHeight = "0";
      arr.classList.remove("open");
      hdr.classList.remove("open");
      openCard = null;
    } else {
      body.style.willChange = "max-height";
      requestAnimationFrame(() => {
        const inner = body.querySelector(".exp-body-inner");
        const targetHeight = inner ? inner.scrollHeight : 400;
        body.style.maxHeight = targetHeight + "px";
      });
      arr.classList.add("open");
      hdr.classList.add("open");
      openCard = card;
      const onTransitionEnd = () => {
        body.style.willChange = "auto";
        body.removeEventListener("transitionend", onTransitionEnd);
      };
      body.addEventListener("transitionend", onTransitionEnd, { once: true });
    }
  });

  return card;
}

function updateCardSummary(card, rows, id) {
  const sumEl = card.querySelector(`#sum-${id}`);
  if (!sumEl) return;
  const totalP  = rows.reduce((a, r) => a + safe(r.paid),  0);
  const totalT  = rows.reduce((a, r) => a + safe(r.total), 0);
  const allPaid = rows.every(r => safe(r.total) - safe(r.paid) <= 0);
  sumEl.innerHTML = allPaid
    ? `<span class="badge badge-paid">Paid</span>`
    : `<span style="font-size:0.75rem;color:var(--muted)">${fmtRs(totalP)} / ${fmtRs(totalT)}</span>`;
}

/* ═══════════════════════════════════════════
   RENDER
═══════════════════════════════════════════ */
function render() {
  enforceDefaults();
  openCard = null;
  const container = el("content");
  container.innerHTML = "";

  let termTotal=0, termPaid=0, otherTotal=0, otherPaid=0;
  if (VIEW === "term") {
    renderTermView(container);
    const t = calcTermTotals();
    termTotal = t.total; termPaid = t.paid;
    updateProgress(t.total, t.paid);
  } else if (VIEW === "other") {
    renderOtherView(container);
    const o = calcOtherTotals();
    otherTotal = o.total; otherPaid = o.paid;
    updateProgress(o.total, o.paid);
  } else {
    renderHistoryView(container);
    const t = calcTermTotals();
    const o = calcOtherTotals();
    termTotal = t.total; termPaid = t.paid;
    otherTotal = o.total; otherPaid = o.paid;
    el("progressBlock").style.display = "none";
  }
  const p = calcPreviousYearTotals();
  const g = { total: termTotal + otherTotal + p.total, paid: termPaid + otherPaid + p.paid, remaining: termTotal + otherTotal + p.total - (termPaid + otherPaid + p.paid) };
  renderSummary(g.total, g.paid, g.remaining);

  el("payBtn").disabled = g.remaining <= 0;
}

function renderTermView(container) {
  const rows = TERMS.map(t => ({ label: t.name, total: t.total, paid: t.paid }));
  const wrap = document.createElement("div");
  wrap.className = "term-table-wrap";
  wrap.innerHTML = buildFeeTable(rows);
  container.appendChild(wrap);
}

function renderOtherView(container) {
  const list = document.createElement("div");
  list.className = "sections-list";
  let anySection = false;

  if (SD.busFee) {
    const entries = orderedEntries(SD.busFee.monthly);
    const rows    = entries.map(([m, v]) => ({ label: capF(m), total: safe(v.total), paid: safe(v.paid) }));
    list.appendChild(buildExpCard({
      id: "bus", icon: iconFor("bus"),
      title: "Bus Fees",
      subtitle: `${MONTH_ORDER.filter(m => SD.busFee.monthly[m]).length} months`,
      rows
    }));
    anySection = true;
  }

  {
    const rows = [{ label: "ECA Fee", total: safe(SD.ecaFee.total), paid: safe(SD.ecaFee.paid) }];
    list.appendChild(buildExpCard({
      id: "eca", icon: iconFor("eca"),
      title: "ECA Fees",
      subtitle: "Extra-Curricular Activities",
      rows
    }));
    anySection = true;
  }

  if (SD.annualFee && safe(SD.annualFee.total) > 0) {
    const rows = [{ label: "Annual Day Fee", total: safe(SD.annualFee.total), paid: safe(SD.annualFee.paid) }];
    list.appendChild(buildExpCard({
      id: "annual", icon: iconFor("annual"),
      title: "Annual Day Fee", subtitle: "", rows
    }));
    anySection = true;
  }

  SD.otherFees.forEach((fee, idx) => {
    let rows = [];
    if (fee.type === "monthly") {
      const entries = orderedEntries(fee.monthly);
      rows = entries.map(([m, v]) => ({ label: capF(m), total: safe(v.total), paid: safe(v.paid) }));
    } else {
      rows = [{ label: fee.name, total: safe(fee.total), paid: safe(fee.paid) }];
    }
    if (!rows.reduce((a, r) => a + r.total, 0)) return;
    list.appendChild(buildExpCard({
      id:       `custom-${idx}`,
      icon:     iconFor(fee.name),
      title:    fee.name,
      subtitle: fee.type === "monthly" ? "Monthly fee" : "One-time fee",
      rows
    }));
    anySection = true;
  });

  if (!anySection) {
    list.innerHTML = `<p style="padding:2.5rem;text-align:center;color:var(--muted);font-size:0.9rem;">No other fees configured.</p>`;
  }
  container.appendChild(list);

  /* ─────────── Previous Year Pending Fees (expandable card) ─────────── */
  if (SD.previousYearFees && (SD.previousYearFees.tuition || SD.previousYearFees.bus)) {
    const rows = [];
    if (SD.previousYearFees.tuition) rows.push({
      label: "Previous Year Tuition Fee",
      total: safe(SD.previousYearFees.tuition.total),
      paid:  safe(SD.previousYearFees.tuition.paid)
    });
    if (SD.previousYearFees.bus) rows.push({
      label: "Previous Year Bus Fee",
      total: safe(SD.previousYearFees.bus.total),
      paid:  safe(SD.previousYearFees.bus.paid)
    });

    const totalT = rows.reduce((a, r) => a + r.total, 0);
    const totalP = rows.reduce((a, r) => a + r.paid, 0);
    const remaining = totalT - totalP;

    const iconHtml = remaining > 0
      ? `<span class="blink-warn">⚠️</span>`
      : `✅`;

    const card = buildExpCard({
      id: "previous-year",
      icon: iconHtml,
      title: "Previous Year Pending Fees",
      subtitle: remaining > 0 ? "Arrears pending" : "All arrears cleared",
      rows
    });
    container.appendChild(card);
  }
}

   HISTORY VIEW
═══════════════════════════════════════════ */
function renderHistoryView(container) {
  const activeReceipts = (SD.receipts || [])
    .filter(r => !r.status || r.status === "active")
    .slice()
    .reverse();

  if (!activeReceipts.length) {
    const wrap = document.createElement("div");
    wrap.className = "term-table-wrap";
    wrap.innerHTML = `
      <div class="hist-empty">
        <div class="hist-empty-icon">📋</div>
        <div class="hist-empty-title">No payment history yet</div>
        <div class="hist-empty-sub">Payments will appear here after recording</div>
      </div>`;
    container.appendChild(wrap);
    return;
  }

  const filterBar = document.createElement("div");
  filterBar.className = "filter-bar";
  filterBar.innerHTML = `
    <span class="filter-label">Filter:</span>
    <select class="filter-select" id="hist-filter">
      <option value="all">All Types</option>
      <option value="term">Term</option>
      <option value="bus">Bus</option>
      <option value="eca">ECA</option>
      <option value="annual">Annual</option>
      <option value="other">Other</option>
      <option value="previous">Previous Year</option>
    </select>
    <span class="hist-count" id="hist-count">${activeReceipts.length} record${activeReceipts.length !== 1 ? "s" : ""}</span>`;
  container.appendChild(filterBar);

  const tableWrap = document.createElement("div");
  tableWrap.className = "term-table-wrap";
  container.appendChild(tableWrap);

  function renderTable(filterType) {
    let filtered;
    if (filterType === "all") {
      filtered = activeReceipts;
    } else if (filterType === "previous") {
      filtered = activeReceipts.filter(r => r.type === "previous_tuition" || r.type === "previous_bus");
    } else {
      filtered = activeReceipts.filter(r => r.type === filterType);
    }

    const countEl = document.getElementById("hist-count");
    if (countEl) countEl.textContent = `${filtered.length} record${filtered.length !== 1 ? "s" : ""}`;

    if (!filtered.length) {
      tableWrap.innerHTML = `
        <div class="hist-empty">
          <div class="hist-empty-icon">🔍</div>
          <div class="hist-empty-title">No records for this filter</div>
          <div class="hist-empty-sub">Try selecting "All Types"</div>
        </div>`;
      return;
    }

    const rows = filtered.map(r => {
      const amt    = safe(r.amount);
      const amtCls = amt < 0 ? "color:var(--red)" : "color:var(--green)";
      return `<tr>
        <td style="text-align:left">
          <div class="hist-code-cell">
            <div class="hist-label">${htmlEscape(r.subType || "—")}</div>
            <div class="hist-code-text">${htmlEscape(r.code || "—")}</div>
          </div>
        </td>
        <td style="${amtCls};font-weight:700">${fmtRs(amt)}</td>
        <td style="font-size:0.8rem;white-space:nowrap">${htmlEscape(r.date || "—")}</td>
        <td style="font-size:0.75rem;white-space:nowrap">${(r.mode || "upi") === "cash" ? "💵 Cash" : "📲 UPI"}</td>
      </tr>`;
    }).join("");

    tableWrap.innerHTML = `
      <div class="fee-table-scroll">
        <table class="fee-table">
          <thead><tr>
            <th style="text-align:left">Fee / Receipt Code</th>
            <th>Amount</th>
            <th>Date</th>
            <th>Mode</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  renderTable("all");
  filterBar.querySelector("#hist-filter").addEventListener("change", function () {
    renderTable(this.value);
  });
}

═══════════════════════════════════════════ */
function receiptCode(name, cls, subType, amount) {
  const words    = name.trim().split(/\s+/);
  const initials = words.length === 1
    ? words[0][0].toUpperCase() + "X"
    : words.slice(0, 2).map(w => w[0]).join("").toUpperCase();
  const cn    = cls.replace(/\D/g, "");
  const tn    = (subType.match(/\d+/) || ["0"])[0];
  const ap    = String(Math.abs(amount)).slice(0, 2);
  const seq   = Date.now().toString().slice(-6) + Math.random().toString(36).slice(2, 4).toUpperCase();
  const idSfx = ((studentId.match(/\d+/) || ["0"])[0]).padStart(3, "0");
  return `${initials}${cn}${tn}${ap}${seq}${idSfx}`;
}

/* ═══════════════════════════════════════════
   PAYMENT HANDLER (admin only)
═══════════════════════════════════════════ */
async function applyPayment(feeType, identifier, amount, isFull, mode = "upi") {
  if (!adminUser) {
    toast("Admin login required.");
    return false;
  }
  enforceDefaults();
  let item = null, subType = "";

  if (feeType === "term") {
    const idx = parseInt(identifier);
    if (isNaN(idx) || !TERMS[idx]) { alert("Invalid term"); return false; }
    item = TERMS[idx]; subType = item.name;

  } else if (feeType === "bus") {
    if (!SD.busFee) { alert("Bus fee not configured"); return false; }
    const m = identifier;
    if (!SD.busFee.monthly[m]) SD.busFee.monthly[m] = { total: 0, paid: 0 };
    item = SD.busFee.monthly[m];
    subType = `Bus Fee – ${capF(m)}`;

  } else if (feeType === "eca") {
    item = SD.ecaFee; subType = "ECA Fee";

  } else if (feeType === "annual") {
    if (!SD.annualFee) { alert("Annual fee not configured"); return false; }
    item = SD.annualFee; subType = "Annual Day Fee";

  } else if (feeType === "other") {
    const parts = String(identifier).split(":");
    if (parts.length === 2) {
      const fIdx  = parseInt(parts[0]);
      const month = parts[1];
      const fee   = SD.otherFees[fIdx];
      if (!fee || !month) { alert("Fee not found"); return false; }
      if (!fee.monthly[month]) fee.monthly[month] = { total: 0, paid: 0 };
      item    = fee.monthly[month];
      subType = `${fee.name} – ${capF(month)}`;
    } else {
      const idx = parseInt(identifier);
      if (isNaN(idx) || !SD.otherFees[idx]) { alert("Fee not found"); return false; }
      item    = SD.otherFees[idx];
      subType = item.name;
    }

  } else if (feeType === "previous_tuition") {
    if (!SD.previousYearFees?.tuition) { alert("Previous year tuition not configured"); return false; }
    item = SD.previousYearFees.tuition;
    subType = "Previous Year Tuition Fee";

  } else if (feeType === "previous_bus") {
    if (!SD.previousYearFees?.bus) { alert("Previous year bus not configured"); return false; }
    item = SD.previousYearFees.bus;
    subType = "Previous Year Bus Fee";

  } else {
    alert("Unknown fee type"); return false;
  }

  if (!item || item.total === undefined) { alert("Fee has no total set"); return false; }

  const currentPaid = safe(item.paid);
  const totalAmt    = safe(item.total);
  const newPaid     = isFull
    ? totalAmt
    : Math.max(0, Math.min(totalAmt, currentPaid + safe(amount)));
  const delta       = newPaid - currentPaid;

  if (delta === 0) {
    toast("No change — paid amount is already at this value.");
    return false;
  }

  const prevPaid             = safe(item.paid);
  const prevReceiptsSnapshot = (SD.receipts || []).map(r => ({ ...r }));

  item.paid = newPaid;

  const absAmount = Math.abs(delta);
  const code      = receiptCode(SD.name, SD.class, subType, absAmount);
  const recObj    = { code, amount: delta, type: feeType, subType, date: today(), status: "active", mode };

  if (!Array.isArray(SD.receipts)) SD.receipts = [];
  SD.receipts.push(recObj);
  if (SD.receipts.length > MAX_RECEIPTS) SD.receipts = SD.receipts.slice(-MAX_RECEIPTS);

  const updateData = { receipts: SD.receipts };
  if      (feeType === "term")   updateData.terms     = TERMS;
  else if (feeType === "bus")    updateData.busFee    = SD.busFee;
  else if (feeType === "eca")    updateData.ecaFee    = { total: safe(SD.ecaFee.total), paid: safe(SD.ecaFee.paid) };
  else if (feeType === "annual") updateData.annualFee = SD.annualFee;
  else if (feeType === "other")  updateData.otherFees = SD.otherFees;
  else if (feeType === "previous_tuition" || feeType === "previous_bus") updateData.previousYearFees = SD.previousYearFees;

  try {
    await updateDoc(dbRef(), updateData);
  } catch (err) {
    item.paid   = prevPaid;
    SD.receipts = prevReceiptsSnapshot;
    toast("Error saving payment: " + err.message);
    console.error("applyPayment error:", err);
    render();
    return false;
  }

  render();
  await showSuccess(subType, absAmount, code);
  return true;
}

/* ═══════════════════════════════════════════
   EDIT PAYMENT SYSTEM
═══════════════════════════════════════════ */
function getFeeItemByReceipt(receipt) {
  const { type, subType } = receipt;

  if (type === "term") {
    const term = TERMS.find(t => t.name === subType);
    return term ? { item: term } : null;
  }
  if (type === "bus") {
    const dashIdx = subType.indexOf("–");
    const month   = dashIdx !== -1 ? subType.slice(dashIdx + 1).trim().toLowerCase() : "";
    if (!month || !SD.busFee?.monthly[month]) return null;
    return { item: SD.busFee.monthly[month] };
  }
  if (type === "eca")    return SD.ecaFee    ? { item: SD.ecaFee }    : null;
  if (type === "annual") return SD.annualFee ? { item: SD.annualFee } : null;
  if (type === "other") {
    const dashIdx = subType.indexOf("–");
    if (dashIdx !== -1) {
      const feeName = subType.slice(0, dashIdx).trim();
      const month   = subType.slice(dashIdx + 1).trim().toLowerCase();
      const fee     = SD.otherFees.find(f => f.name === feeName);
      if (!fee || !fee.monthly?.[month]) return null;
      return { item: fee.monthly[month] };
    }
    const fee = SD.otherFees.find(f => f.name === subType);
    return fee ? { item: fee } : null;
  }
  if (type === "previous_tuition") return SD.previousYearFees?.tuition ? { item: SD.previousYearFees.tuition } : null;
  if (type === "previous_bus")     return SD.previousYearFees?.bus     ? { item: SD.previousYearFees.bus }     : null;

  return null;
}

function editPayment(code) {
  if (!isAdminMode) { toast("Unauthorized access."); return; }
  if (!code)        { toast("Invalid receipt code."); return; }

  const receipt = (SD.receipts || []).find(
    r => r.code === code && (!r.status || r.status === "active")
  );
  if (!receipt) { toast("Receipt not found or already cancelled."); return; }

  const feeRef = getFeeItemByReceipt(receipt);
  if (!feeRef)  { toast("Cannot locate fee record. Contact admin."); return; }

  const { item }     = feeRef;
  const oldAmt       = safe(receipt.amount);
  const currentPaid  = safe(item.paid);
  const total        = safe(item.total);
  const revertedPaid = Math.max(0, currentPaid - oldAmt);
  const maxAllowed   = Math.max(0, total - revertedPaid);

  const resetAdmin = () => { isAdminMode = false; };

  const m = overlay(`
    <button class="modal-close">✕</button>
    <h3>✏ Edit Payment</h3>
    <div class="edit-info-box">
      <div class="edit-info-fee">${htmlEscape(receipt.subType || "—")}</div>
      <div class="edit-info-meta">Recorded: ${fmtRs(oldAmt)} &nbsp;·&nbsp; Date: ${htmlEscape(receipt.date || "—")}</div>
      <div class="edit-info-code">${htmlEscape(receipt.code)}</div>
    </div>

      min="0" max="${maxAllowed}" value="${oldAmt > 0 ? oldAmt : 1}">
    <div class="edit-max-hint">
      <span>Max allowed:</span>
      <strong>${fmtRs(maxAllowed)}</strong>
    </div>
    <label>Payment Mode</label>
    <select id="edit-mode">
      <option value="upi">📲 UPI (Online)</option>
      <option value="cash">💵 Cash</option>
    </select>
    <div class="modal-actions">
      <button class="btn-modal btn-modal-cancel" id="m-cancel">Cancel</button>
      <button class="btn-modal btn-modal-ok"     id="m-ok">✓ Update</button>
    </div>`, resetAdmin);

  const amtInput  = m.querySelector("#edit-amt");
  const modeInput = m.querySelector("#edit-mode");
  modeInput.value = receipt.mode || "upi";
  amtInput.focus();

  m.querySelector("#m-cancel").onclick = () => { resetAdmin(); closeAllOverlays(); };

  const okBtn = m.querySelector("#m-ok");
  okBtn.onclick = async () => {
    const raw = amtInput.value.trim();
    if (!raw)              { toast("Please enter an amount."); return; }
    const val = parseFloat(raw);
    if (isNaN(val))        { toast("Invalid amount. Enter a number."); return; }
    if (val <= 0)          { toast("Amount must be greater than 0."); return; }
    if (val > maxAllowed)  { toast(`Cannot exceed max allowed: ${fmtRs(maxAllowed)}`); return; }
    if (val === oldAmt && modeInput.value === (receipt.mode || "upi")) {
      toast("No change — amount and mode are the same.");
      return;
    }
    okBtn.disabled = true;
    const newMode = modeInput.value;
    closeAllOverlays();
    await applyEdit(receipt, val, newMode);
  };
}

async function applyEdit(oldReceipt, newAmount, newMode = "upi") {
  if (!isAdminMode) { toast("Unauthorized access."); return; }
  if (!adminUser) { toast("Admin login required."); isAdminMode = false; return; }
  enforceDefaults();

  const feeRef = getFeeItemByReceipt(oldReceipt);
  if (!feeRef) { toast("Fee item not found — edit aborted."); isAdminMode = false; return; }

  const { item } = feeRef;
  const oldAmt   = safe(oldReceipt.amount);
  const total    = safe(item.total);

  const prevItemPaid         = safe(item.paid);
  const prevReceiptsSnapshot = (SD.receipts || []).map(r => ({ ...r }));

  try {
    item.paid = Math.max(0, Math.min(total, safe(item.paid) - oldAmt + newAmount));
    oldReceipt.status = "cancelled";

    const newCode    = receiptCode(SD.name, SD.class, oldReceipt.subType, newAmount);
    const newReceipt = {
      code:    newCode,
      amount:  newAmount,
      type:    oldReceipt.type,
      subType: oldReceipt.subType,
      date:    today(),
      status:  "active",
      mode:    newMode
    };

    if (!Array.isArray(SD.receipts)) SD.receipts = [];
    SD.receipts.push(newReceipt);
    if (SD.receipts.length > MAX_RECEIPTS) {
      SD.receipts = SD.receipts.slice(-MAX_RECEIPTS);
    }

    await saveAll();

    render();
    await showSuccess(oldReceipt.subType, newAmount, newCode);

  } catch (err) {
    item.paid   = prevItemPaid;
    SD.receipts = prevReceiptsSnapshot;
    toast("Error saving edit: " + err.message);
    console.error("applyEdit error:", err);
    render();

  } finally {
    isAdminMode = false;
  }
}

function closeAllOverlays() {
  document.querySelectorAll(".overlay").forEach(o => o.remove());
}

function overlay(html, onDismiss) {
  closeAllOverlays();
  const ov = document.createElement("div");
  ov.className = "overlay";
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = html;
  ov.appendChild(m);
  document.body.appendChild(ov);

  const dismiss = () => {
    if (typeof onDismiss === "function") onDismiss();
    closeAllOverlays();
  };

  ov.addEventListener("click", e => { if (e.target === ov) dismiss(); });

  const cl = m.querySelector(".modal-close");
  if (cl) cl.onclick = dismiss;

  return m;
}

/* ═══════════════════════════════════════════
   STEALTH KEYBOARD SHORTCUTS
═══════════════════════════════════════════ */
let keys      = { a: false, d: false, e: false };
let comboLock = false;

document.addEventListener("keydown", e => {
  const tag = e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

  const k = e.key.toLowerCase();
  if (k === "a") keys.a = true;
  if (k === "d") keys.d = true;
  if (k === "e") keys.e = true;

  if (comboLock) return;

  if (keys.a && keys.d) {
    comboLock = true;
    openAdminAuth("add");
  } else if (keys.e && keys.d) {
    comboLock = true;
    openAdminAuth("edit");
  }
});

document.addEventListener("keyup", e => {
  const k = e.key.toLowerCase();
  if (k === "a") keys.a = false;
  if (k === "d") keys.d = false;
  if (k === "e") keys.e = false;
  comboLock = false;
});

window.addEventListener("blur", () => {
  keys.a = keys.d = keys.e = false;
  comboLock = false;
});

/* ═══════════════════════════════════════════
   UNIFIED ADMIN AUTH MODAL (Firebase) – PASSWORD ONLY
═══════════════════════════════════════════ */
function openAdminAuth(mode) {
  if (adminUser) {
    if (mode === "add") {
      adminSelectFeeType();
    } else {
      isAdminMode = true;
      openAdminEditSelector();
    }
    return;
  }

  const m = overlay(`
    <button class="modal-close">✕</button>
    <h3>🔐 Admin Login</h3>
    <label>Password</label>
    <input type="password" id="admin-pass" placeholder="Enter password" autocomplete="current-password">
    <div class="modal-actions">
      <button class="btn-modal btn-modal-cancel" id="m-cancel">Cancel</button>
      <button class="btn-modal btn-modal-ok"     id="m-ok">Login</button>
    </div>`);

  const passInput = m.querySelector("#admin-pass");
  const okBtn     = m.querySelector("#m-ok");
  passInput.focus();

  const attempt = async () => {
    const password = passInput.value;
    if (!password) {
      toast("Please enter password.");
      return;
    }
    okBtn.disabled = true;
    try {
      await signInWithEmailAndPassword(auth, ADMIN_EMAIL_1, password);
    } catch (err1) {
      try {
        await signInWithEmailAndPassword(auth, ADMIN_EMAIL_2, password);
      } catch (err2) {
        toast("Wrong password");
        okBtn.disabled = false;
        passInput.value = "";
        passInput.focus();
        return;
      }
    }
    closeAllOverlays();
    if (mode === "add") {
      adminSelectFeeType();
    } else {
      isAdminMode = true;
      openAdminEditSelector();
    }
  };

  m.querySelector("#m-cancel").onclick = closeAllOverlays;
  okBtn.onclick = attempt;
  passInput.addEventListener("keydown", e => {
    if (e.key === "Enter") attempt();
  });
}

  if (!receipts.length) {
    toast("No active records to edit.");
    isAdminMode = false;
    return;
  }

  const options = receipts.map(r => {
    const safeCode = htmlEscape(r.code || "");
    const safeText = `${htmlEscape(r.subType || "—")} — ${fmtRs(r.amount)} (${htmlEscape(r.date || "—")})`;
    return `<option value="${safeCode}">${safeText}</option>`;
  }).join("");

  const resetAdmin = () => { isAdminMode = false; };

  const m = overlay(`
    <button class="modal-close">✕</button>
    <h3>✏ Select Payment to Edit</h3>
    <label>Payment Record</label>
    <select id="edit-select">${options}</select>
    <div class="modal-actions" style="justify-content:space-between">
      <button class="btn-modal btn-modal-cancel" style="background:transparent;color:var(--red);border:1px solid var(--red);padding:0.4rem 0.9rem;" id="m-signout">🚪 Sign Out</button>
      <div style="display:flex;gap:0.5rem">
        <button class="btn-modal btn-modal-cancel" id="m-cancel">Cancel</button>
        <button class="btn-modal btn-modal-ok"     id="m-ok">Edit</button>
      </div>
    </div>`, resetAdmin);

  m.querySelector("#m-cancel").onclick = () => { resetAdmin(); closeAllOverlays(); };

  m.querySelector("#m-signout").onclick = async () => {
    closeAllOverlays();
    isAdminMode = false;
    await signOut(auth);
    toast("Signed out.");
  };

  m.querySelector("#m-ok").onclick = () => {
    const code = m.querySelector("#edit-select").value;
    closeAllOverlays();
    editPayment(code);
  };
}

/* ═══════════════════════════════════════════
   VIEW TABS
═══════════════════════════════════════════ */
function setView(v) {
  VIEW = v;
  el("tabTerm").classList.toggle("active",    v === "term");
  el("tabOther").classList.toggle("active",   v === "other");
  el("tabHistory").classList.toggle("active", v === "history");
  render();
}

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
window.addEventListener("DOMContentLoaded", () => {
  detectSystemTheme();

  el("logoutBtn").onclick = async () => {
    if (adminUser) {
      await signOut(auth);
    }
    location.href = "../index.html";
  };

  el("tabTerm").onclick    = () => setView("term");
  el("tabOther").onclick   = () => setView("other");
  el("tabHistory").onclick = () => setView("history");
  el("payBtn").onclick     = openPay;
  el("helpBtn").onclick    = openHelp;

  loadStudent();

  let longPressTimer = null;
  const nameEl = el("studentName");

  nameEl.addEventListener("touchstart", () => {
    longPressTimer = setTimeout(() => {
      longPressTimer = null;
      openAdminAuth("add");
    }, 1300);
  }, { passive: true });

  const cancelLongPress = () => {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  };
  nameEl.addEventListener("touchend",    cancelLongPress, { passive: true });
  nameEl.addEventListener("touchmove",   cancelLongPress, { passive: true });
  nameEl.addEventListener("touchcancel", cancelLongPress, { passive: true });
});
</script>

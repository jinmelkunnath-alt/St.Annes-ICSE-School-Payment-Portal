<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover">
    <title>Login | Fee Portal</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(145deg, #f0f4fa 0%, #e9eef5 100%);
            --card-bg: #ffffff;
            --heading-color: #0f2b3d;
            --label-color: #2c4c6e;
            --input-bg: #ffffff;
            --input-border: #e2e9f0;
            --input-text: #1a2c3e;
            --input-placeholder: #b7c3d2;
            --btn-bg: #1e4a76;
            --btn-hover-bg: #0f3a5c;
            --btn-shadow: rgba(30, 74, 118, 0.25);
            --footer-color: #8da0b0;
            --error-bg: #fff4f2;
            --error-color: #bc4e2c;
            --error-border: #bc4e2c;
            --toggle-icon-color: #4a627a;
            --card-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.02);
            --card-hover-shadow: 0 25px 40px -14px rgba(0, 0, 0, 0.12);
        }

        body.dark-mode {
            --bg-gradient: linear-gradient(145deg, #0f1720 0%, #1b2430 100%);
            --card-bg: #1b2430;
            --heading-color: #f3f6fa;
            --label-color: #cbd5e1;
            --input-bg: #111827;
            --input-border: #2d3748;
            --input-text: #f3f6fa;
            --input-placeholder: #64748b;
            --btn-bg: #1e4a76;
            --btn-hover-bg: #163d5c;
            --btn-shadow: rgba(30, 74, 118, 0.4);
            --footer-color: #94a3b8;
            --error-bg: #3a1f1f;
            --error-color: #ffb4a8;
            --error-border: #ffb4a8;
            --toggle-icon-color: #cbd5e1;
            --card-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.3);
            --card-hover-shadow: 0 25px 40px -14px rgba(0, 0, 0, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            transition: background 0.3s ease;
        }

        /* Card */
        .login-card {
            background: var(--card-bg);
            border-radius: 2rem;
            width: 100%;
            max-width: 380px;
            padding: 2rem 1.8rem 2.2rem;
            box-shadow: var(--card-shadow);
            transition: background-color 0.3s ease, box-shadow 0.3s ease, color 0.3s ease;
            position: relative;
        }

        .login-card:hover {
            box-shadow: var(--card-hover-shadow);
        }

        h3 {
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--heading-color);
            margin-bottom: 1.4rem;
            letter-spacing: -0.3px;
            border-left: 4px solid #1e4a76;
            padding-left: 0.8rem;
            transition: color 0.3s ease;
        }

        /* Dark mode toggle button */
        .dark-mode-toggle {
            position: absolute;
            top: 1.2rem;
            right: 1.2rem;
            background: transparent;
            border: none;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--toggle-icon-color);
            transition: color 0.3s ease;
            border-radius: 0.5rem;
        }
        .dark-mode-toggle:hover {
            opacity: 0.8;
        }
        .dark-mode-toggle svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        /* Input groups */
        .input-group {
            margin-bottom: 1.3rem;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--label-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.4rem;
            margin-left: 0.25rem;
            transition: color 0.3s ease;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1.5px solid var(--input-border);
            border-radius: 1.2rem;
            font-size: 0.95rem;
            font-family: inherit;
            background: var(--input-bg);
            transition: all 0.2s ease, background-color 0.3s, border-color 0.3s, color 0.3s;
            color: var(--input-text);
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #1e4a76;
            box-shadow: 0 0 0 3px rgba(30, 74, 118, 0.15);
        }

        .input-wrapper input::placeholder {
            color: var(--input-placeholder);
            font-weight: 400;
            transition: color 0.3s ease;
        }

        /* Professional eye icon (SVG) */
        .eye-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            padding: 0;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .eye-icon:hover {
            opacity: 1;
        }

        .eye-icon svg {
            width: 20px;
            height: 20px;
            stroke: var(--toggle-icon-color);
            stroke-width: 1.8;
            fill: none;
            transition: stroke 0.2s;
        }

        .eye-icon:hover svg {
            stroke: #1e4a76;
        }

        /* Login Button */
        .login-btn {
            width: 100%;
            background: var(--btn-bg);
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.85rem 1rem;
            border: none;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.2s ease, background-color 0.3s, box-shadow 0.3s;
            font-family: inherit;
            margin-top: 0.8rem;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .login-btn:hover {
            background: var(--btn-hover-bg);
            transform: translateY(-1px);
            box-shadow: 0 6px 14px var(--btn-shadow);
        }

        .login-btn:active {
            transform: translateY(1px);
        }

        /* Error message */
        .error-msg {
            color: var(--error-color);
            font-size: 0.75rem;
            margin-top: 0.8rem;
            padding: 0.5rem 0.8rem;
            background: var(--error-bg);
            border-radius: 1rem;
            text-align: center;
            border-left: 3px solid var(--error-border);
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        /* small footer */
        .login-footer {
            text-align: center;
            font-size: 0.7rem;
            color: var(--footer-color);
            margin-top: 1.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid #eef2f8;
            transition: color 0.3s ease;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 1.6rem 1.4rem 1.8rem;
            }
            h3 {
                font-size: 1.4rem;
            }
            .input-wrapper input {
                padding: 0.75rem 0.9rem;
            }
        }
    </style>
</head>
<body>

<div class="login-card">
    <button class="dark-mode-toggle" id="darkModeToggle" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
    </button>

    <h3>Secure Login</h3>

    <div class="input-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
            <input type="text" id="username" placeholder="Enter your username" autocomplete="off">
        </div>
    </div>

    <div class="input-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
            <input type="password" id="password" placeholder="********">
            <button type="button" class="eye-icon" id="togglePasswordBtn" aria-label="Show password">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

                    <circle cx="12" cy="12" r="3" stroke="currentColor" fill="none"/>
                </svg>
            </button>
        </div>
    </div>

    <button class="login-btn" id="loginBtn">Login →</button>
    <div id="errorMsg" class="error-msg" style="display: none;"></div>
    <div class="login-footer">Powered By

        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const errorDiv = document.getElementById('errorMsg');

        // Helper: show error message
        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                if (errorDiv.textContent === msg) {
                    errorDiv.style.opacity = '0';
                    setTimeout(() => {
                        if (errorDiv.textContent === msg) {
                            errorDiv.style.display = 'none';
                            errorDiv.style.opacity = '';
                        }
                    }, 200);
                }
            }, 3000);
        }

        function clearError() {
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
        }

        // Toggle password visibility
        const toggleBtn = document.getElementById('togglePasswordBtn');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
            });
        }

        // Login logic
        function handleLogin() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showError("Please enter both username and password.");
                return;
            }

            const matched = USERS.find(user => user.username === username && user.password === password);

            if (matched) {
                window.location.href = matched.redirect;
            } else {
                showError("Invalid username or password");
                passwordInput.focus();
            }
        }

        // Event listeners
        loginBtn.addEventListener('click', handleLogin);
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
        usernameInput.addEventListener('input', () => clearError());
        passwordInput.addEventListener('input', () => clearError());
    })();

<script>
    (function() {
        const body = document.body;
        const toggleBtn = document.getElementById('darkModeToggle');

        const sunIcon = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
        const moonIcon = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;

        function setTheme(theme) {
            if (theme === 'dark') {
                body.classList.add('dark-mode');
                toggleBtn.innerHTML = sunIcon;
            } else {
                body.classList.remove('dark-mode');
                toggleBtn.innerHTML = moonIcon;
            }
        }

        const storedTheme = localStorage.getItem('theme');
        if (storedTheme) {
            setTheme(storedTheme);
        } else {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            setTheme(prefersDark ? 'dark' : 'light');
        }

        toggleBtn.addEventListener('click', () => {
            const isDark = body.classList.contains('dark-mode');
            const newTheme = isDark ? 'light' : 'dark';
            setTheme(newTheme);
            localStorage.setItem('theme', newTheme);
        });

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!localStorage.getItem('theme')) {
                setTheme(e.matches ? 'dark' : 'light');
            }
        });
    })();
</script>

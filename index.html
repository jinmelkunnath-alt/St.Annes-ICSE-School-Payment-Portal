<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>St. Annes ICSE School | Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    background: #f5f7fc;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    padding: 1rem;
}

.login-container {
    background: white;
    padding: 2rem;
    border-radius: 1.5rem;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

h1 {
    font-size: 1.4rem;
    color: #1e4a76;
    margin-bottom: 1.5rem;
    text-align: center;
}

.input-group {
    position: relative;
}

input {
    width: 100%;
    padding: 0.9rem;
    margin-bottom: 1rem;
    border-radius: 0.8rem;
    border: 1px solid #dce5ef;
    font-size: 0.9rem;
}

input:focus {
    outline: none;
    border-color: #1e4a76;
}

.toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.8rem;
    color: #1e4a76;
    cursor: pointer;
    user-select: none;
}

button {
    width: 100%;
    padding: 0.9rem;
    border: none;
    border-radius: 2rem;
    background: #1e4a76;
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #0f3a5c;
}

.footer {
    text-align: center;
    font-size: 0.75rem;
    color: #7b8a9a;
    margin-top: 1rem;
}
</style>
</head>

<body>

<div class="login-container">
    <h1>St. Annes ICSE School</h1>

    <input type="text" id="username" placeholder="Username">

    <div class="input-group">
        <input type="password" id="password" placeholder="Password">
        <span class="toggle-password" id="togglePassword">Show</span>
    </div>

    <button id="loginBtn">Login</button>

    <div class="footer">
        Secure Student Fee Portal
    </div>
</div>

<script>
// ---------- USERS ----------
const users = [
  {
    username: "Mariya Melbin",
    password: "Mariya_Melbin_VII",
    id: "mariya"
  },
  {
    username: "Daron Mathew",
    password: "Daron_Mathew_II",
    id: "daron"
  }
];

// ---------- PASSWORD TOGGLE ----------
document.getElementById("togglePassword").addEventListener("click", function () {
    const passwordInput = document.getElementById("password");

    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        this.innerText = "Hide";
    } else {
        passwordInput.type = "password";
        this.innerText = "Show";
    }
});

// ---------- INIT ----------
document.getElementById("loginBtn").addEventListener("click", handleLogin);

document.addEventListener("keydown", function (e) {
  if (e.key === "Enter") handleLogin();
});

// ---------- LOGIN ----------
function handleLogin() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();

  removeError();

  const user = users.find(
    u => u.username === username && u.password === password
  );

  if (user) {
    window.location.href = `students/student.html?id=${user.id}`;
  } else {
    showError("Invalid username or password");
  }
}

// ---------- ERROR ----------
function showError(msg) {
  let error = document.getElementById("errorMsg");

  if (!error) {
    error = document.createElement("div");
    error.id = "errorMsg";
    error.style.color = "#b33b2c";
    error.style.marginTop = "10px";
    error.style.fontSize = "14px";
    document.querySelector(".login-container").appendChild(error);
  }

  error.innerText = msg;
}

function removeError() {
  const error = document.getElementById("errorMsg");
  if (error) error.remove();
}
</script>

</body>
</html>
